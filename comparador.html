<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo Comparativo — Monitor Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #060E06; --bg2: #0A1409; --panel: #0F1C0E; --mapbg: #0a0a0a;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.05);
  --card: rgba(242,245,239,0.045);
  --white: #F2F5EF; --w90: rgba(242,245,239,0.90); --w70: rgba(242,245,239,0.68);
  --w55: rgba(242,245,239,0.50); --w40: rgba(242,245,239,0.38); --w25: rgba(242,245,239,0.22);
  --accent: #C8A882; --data: #6AAA35; --neg: #e05c5c;
  --za: #C8A882; --zb: #6AAA35;
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
  --mono: 'DM Mono', monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--white); font-family: var(--sans); font-weight: 300; overflow: hidden; }
#root { height: 100vh; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.cz-root { display: flex; flex-direction: column; height: 100vh; }

/* ── TOPBAR ── */
.cz-topbar {
  height: 56px; flex-shrink: 0; display: flex; align-items: center;
  justify-content: space-between; padding: 0 20px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
}
.cz-back { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--w55); transition: color .2s; }
.cz-back:hover { color: var(--white); }
.cz-back i { font-size: 13px; }
.cz-logo { height: 26px; width: auto; opacity: .92; }
.cz-title { text-align: center; display: flex; flex-direction: column; gap: 3px; line-height: 1.15; }
.cz-title-main { font-family: var(--mono); font-size: 14px; letter-spacing: .26em; text-transform: uppercase; color: var(--white); font-weight: 500; }
.cz-title-eyebrow { font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.cz-topbar-right { display: flex; align-items: center; gap: 14px; }
.cz-plan-tag { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--w40); border: 1px solid var(--border); border-radius: 5px; padding: 4px 9px; }

/* Toggle sincronizar mapas */
.cz-sync-toggle {
  display: inline-flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--w70);
}
.cz-sync-toggle input { display: none; }
.cz-sync-track {
  position: relative; width: 30px; height: 16px;
  border-radius: 999px; background: rgba(244,247,241,0.08);
  border: 1px solid var(--border); transition: background .2s, border-color .2s;
  flex-shrink: 0;
}
.cz-sync-dot {
  position: absolute; top: 1px; left: 1px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--w40); transition: transform .2s, background .2s;
}
.cz-sync-toggle input:checked + .cz-sync-track {
  background: rgba(106,170,53,0.22);
  border-color: rgba(106,170,53,0.45);
}
.cz-sync-toggle input:checked + .cz-sync-track .cz-sync-dot {
  transform: translateX(14px);
  background: var(--accent);
}
.cz-sync-toggle:hover .cz-sync-track { border-color: var(--w40); }
.cz-sync-label { white-space: nowrap; }
.cz-export {
  display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500;
  color: var(--bg); background: var(--accent); padding: 7px 14px; border-radius: 7px; transition: filter .2s; cursor: pointer;
}
.cz-export:hover { filter: brightness(1.08); }

/* ── BODY ── */
.cz-body { flex: 1; min-height: 0; display: flex; }

/* ── SIDEBAR ── */
.cz-sidebar {
  width: 234px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 14px; padding: 18px 16px; overflow-y: auto;
}
.cz-side-group { display: flex; flex-direction: column; gap: 5px; }
.cz-side-label { font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--w40); }
.cz-side-divider { height: 1px; background: var(--border); margin: 2px 0; }

/* zone selector */
.cz-zsel { position: relative; width: 100%; }
.cz-zsel-btn {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left;
  background: var(--card); border: 1px solid var(--border); border-left-width: 3px; border-radius: 8px;
  padding: 7px 9px; transition: border-color .2s, background .2s; cursor: pointer;
}
.cz-zsel--a .cz-zsel-btn { border-left-color: var(--za); }
.cz-zsel--b .cz-zsel-btn { border-left-color: var(--zb); }
.cz-zsel-btn:hover, .cz-zsel-btn.open { background: rgba(255,255,255,0.04); }
.cz-zsel-name { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.cz-zsel-title { font-size: 12px; font-weight: 500; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cz-zsel-meta { font-family: var(--mono); font-size: 8.5px; letter-spacing: .04em; color: var(--w40); text-transform: uppercase; }
.cz-zsel-caret { font-size: 10px; color: var(--w40); transition: transform .2s; flex-shrink: 0; }
.cz-zsel-btn.open .cz-zsel-caret { transform: rotate(180deg); }
.cz-zsel-menu {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 1200;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 6px; box-shadow: 0 18px 44px rgba(0,0,0,0.55); max-height: 280px; overflow-y: auto;
}
.cz-zsel-item {
  width: 100%; display: flex; flex-direction: column; gap: 2px; text-align: left;
  padding: 9px 11px; border-radius: 8px; transition: background .15s; cursor: pointer;
}
.cz-zsel-item:hover { background: rgba(255,255,255,0.05); }
.cz-zsel-item.sel { background: rgba(200,168,130,0.10); }
.cz-zsel-item-title { font-size: 13px; font-weight: 500; color: var(--white); display: flex; align-items: center; gap: 8px; }
.cz-zsel-dup { font-family: var(--mono); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; color: var(--w40); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
.cz-zsel-item-meta { font-family: var(--mono); font-size: 9px; color: var(--w40); text-transform: uppercase; }
.cz-zchip {
  width: 19px; height: 19px; flex-shrink: 0; border-radius: 5px;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10px; font-weight: 500; border: 1px solid;
}
.cz-zchip--a { color: var(--za); border-color: color-mix(in srgb, var(--za) 50%, transparent); background: color-mix(in srgb, var(--za) 12%, transparent); }
.cz-zchip--b { color: var(--zb); border-color: color-mix(in srgb, var(--zb) 50%, transparent); background: color-mix(in srgb, var(--zb) 12%, transparent); }

/* module rail */
.cz-modrail { display: flex; flex-direction: column; gap: 3px; }
.cz-modtab {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  padding: 9px 11px; border-radius: 9px; color: var(--w55); font-size: 13px; font-weight: 400;
  border: 1px solid transparent; transition: background .16s, color .16s, border-color .16s;
}
.cz-modtab-radio { width: 13px; height: 13px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid var(--w25); transition: all .16s; position: relative; }
.cz-modtab i { font-size: 12.5px; width: 16px; text-align: center; color: var(--w40); transition: color .16s; }
.cz-modtab:hover { background: rgba(255,255,255,0.03); color: var(--white); }
.cz-modtab:hover i { color: var(--w70); }
.cz-modtab.active { background: rgba(200,168,130,0.10); color: var(--white); border-color: rgba(200,168,130,0.26); }
.cz-modtab.active i { color: var(--accent); }
.cz-modtab.active .cz-modtab-radio { border-color: var(--accent); }
.cz-modtab.active .cz-modtab-radio::after { content: ''; position: absolute; inset: 2px; border-radius: 50%; background: var(--accent); }
.cz-tab-dot { margin-left: auto; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: .7; }

/* ── CANVAS ── */
.cz-canvas {
  flex: 1; min-width: 0; min-height: 0;
  display: flex; flex-direction: column; gap: 14px;
  padding: 16px 18px; overflow-y: auto; background: var(--bg);
}

/* KPI row */
.cz-kpis { flex-shrink: 0; display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
.cz-kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 15px 17px; display: flex; flex-direction: column; gap: 11px; }
.cz-kpi-head { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--w55); display: flex; align-items: center; gap: 8px; }
.cz-kpi-head i { color: var(--accent); font-size: 12px; }
.cz-kpi-flow { display: flex; align-items: baseline; gap: 10px; }
.cz-kpi-num { font-family: var(--mono); font-weight: 400; letter-spacing: -.02em; font-size: 27px; }
.cz-kpi-num--a { color: var(--w70); }
.cz-kpi-num--b { color: var(--white); }
.cz-kpi-arrow { font-size: 13px; color: var(--w40); align-self: center; }
.cz-kpi-delta {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 12.5px; border: 1px solid; border-radius: 50px; padding: 3px 11px;
}
.cz-kpi-delta-tag { font-size: 8.5px; letter-spacing: .1em; color: var(--w40); border-left: 1px solid var(--border); padding-left: 7px; margin-left: 1px; }

/* stage */
.cz-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }

/* map tiles */
.cz-tiles { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: 42vh; min-height: 260px; }
.cz-tile { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.cz-tile-head { display: flex; align-items: center; gap: 9px; padding: 10px 14px; border-bottom: 1px solid var(--border); border-left: 3px solid transparent; }
.cz-tile-head--a { border-left-color: var(--za); }
.cz-tile-head--b { border-left-color: var(--zb); }
.cz-tile-name { font-family: var(--serif); font-size: 14px; font-weight: 500; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cz-tile-meta { font-family: var(--mono); font-size: 9px; letter-spacing: .04em; text-transform: uppercase; color: var(--w40); margin-left: auto; white-space: nowrap; }
.cz-tile-body { flex: 1; position: relative; min-height: 0; background: var(--mapbg); }
.cz-map { position: absolute; inset: 0; background: var(--mapbg); }
.cz-tile-empty {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 9px; color: var(--w40); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
}
.cz-tile-empty i { font-size: 22px; opacity: .35; }

/* legend */
.cz-legend {
  position: absolute; bottom: 12px; left: 12px; z-index: 650; width: 172px;
  background: rgba(4,14,4,0.78); backdrop-filter: blur(12px);
  border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
}
.cz-legend-title { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--w55); margin-bottom: 7px; }
.cz-legend-bar { height: 8px; border-radius: 3px; }
.cz-legend-scale { display: flex; justify-content: space-between; margin-top: 5px; font-family: var(--mono); font-size: 9px; color: var(--w40); }

/* detail */
.cz-detail { flex: 0 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px 16px; }
.cz-detail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cz-detail-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: inline-flex; align-items: center; gap: 8px; }
.cz-detail-note { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; color: var(--w40); text-transform: uppercase; }

/* metric cards */
.cz-metrics-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
.cz-metric { background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 16px 17px; }
.cz-metric-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--w55); margin-bottom: 11px; }
.cz-metric-vals { display: flex; flex-direction: column; gap: 5px; margin-bottom: 11px; }
.cz-metric-row-v { display: flex; align-items: center; gap: 9px; }
.cz-metric-num { font-family: var(--mono); font-size: 18px; font-weight: 400; letter-spacing: -.01em; }
.cz-delta-line { font-family: var(--mono); font-size: 12px; letter-spacing: .02em; display: flex; align-items: center; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border2); }
.cz-delta-glyph { font-size: 10px; }

/* table */
.cz-table-head { display: flex; align-items: center; gap: 10px; padding: 0 4px 12px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--w70); margin-bottom: 2px; }
.cz-table-head i { color: var(--accent); font-size: 13px; }
.cz-table { width: 100%; border-collapse: collapse; }
.cz-table th { text-align: left; padding: 10px 14px; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--w55); font-weight: 400; border-bottom: 1px solid var(--border); }
.cz-table th:first-child { padding-left: 4px; }
.cz-table th .cz-zchip { margin-right: 7px; vertical-align: middle; }
.cz-th-delta { text-align: center; width: 90px; }
.cz-table td { padding: 10px 14px; border-bottom: 1px solid var(--border2); font-size: 13.5px; }
.cz-table td:first-child { padding-left: 4px; }
.cz-table tr:last-child td { border-bottom: none; }
.cz-td-label { color: var(--w70); }
.cz-td-num { font-family: var(--mono); font-size: 14px; color: var(--white); }
.cz-td-delta { font-family: var(--mono); font-size: 12px; text-align: center; white-space: nowrap; }
.cz-tr-accent td { background: rgba(200,168,130,0.05); }
.cz-tr-accent .cz-td-label { color: var(--accent); font-weight: 500; }
.cz-level { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid; border-radius: 50px; padding: 3px 12px; }

/* ── LOADING ── */
.cz-boot {
  height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; background: var(--bg); color: var(--w40); font-family: var(--mono);
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
}
.cz-boot-spin {
  width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid var(--border); border-top-color: var(--accent);
  animation: cz-spin .8s linear infinite;
}
@keyframes cz-spin { to { transform: rotate(360deg); } }

/* ── UPGRADE ── */
.cz-upgrade {
  height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--bg);
}
.cz-upgrade-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 18px;
  padding: 44px 40px; text-align: center; max-width: 380px; width: 90%;
}
.cz-upgrade-icon { font-size: 32px; color: var(--accent); margin-bottom: 18px; opacity: .85; }
.cz-upgrade-title { font-family: var(--serif); font-size: 22px; margin-bottom: 10px; }
.cz-upgrade-text { font-size: 13.5px; color: var(--w55); line-height: 1.7; margin-bottom: 26px; }
.cz-upgrade-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--accent); color: var(--bg); padding: 10px 24px;
  border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; transition: filter .2s;
}
.cz-upgrade-btn:hover { filter: brightness(1.08); }

/* no-data state inside tile/detail */
.cz-nodata {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 28px 16px; gap: 8px; color: var(--w40);
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
}
.cz-nodata i { font-size: 20px; opacity: .35; }

/* ── PISO VEGETACIONAL strip ── */
.cz-piso { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 7px; }
.cz-piso-head { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 7px; }
.cz-piso-head i { font-size: 10px; }
.cz-piso-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cz-piso-row { display: flex; align-items: flex-start; gap: 9px; font-size: 12px; line-height: 1.5; color: var(--w70); }
.cz-piso-row .cz-zchip { flex-shrink: 0; margin-top: 1px; }
.cz-piso-row em { font-style: italic; color: var(--w55); font-size: 11px; }

/* ── ARCLIM dashboard ── */
.cz-arclim { display: flex; flex-direction: column; gap: 14px; }
.cz-arclim-comunas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cz-arclim-comuna { background: var(--card); border: 1px solid var(--border); border-left-width: 3px; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.cz-arclim-comuna.za { border-left-color: var(--za); }
.cz-arclim-comuna.zb { border-left-color: var(--zb); }
.cz-arclim-comuna-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.cz-arclim-comuna-label { font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--w40); }
.cz-arclim-comuna-name { font-family: var(--serif); font-size: 15px; font-weight: 500; color: var(--white); }
.cz-arclim-comuna-state { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: var(--w55); }

/* indicator dropdown (executive style) */
.cz-arclim-picker { position: relative; }
.cz-arclim-picker-btn {
  width: 100%;
  display: flex; align-items: center; gap: 14px;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 16px; text-align: left; cursor: pointer; transition: border-color .15s, background .15s;
}
.cz-arclim-picker-btn:hover { background: rgba(255,255,255,0.04); border-color: rgba(200,168,130,0.25); }
.cz-arclim-picker-btn.open { border-color: rgba(200,168,130,0.35); background: rgba(255,255,255,0.04); }
.cz-arclim-picker-tag {
  font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--w40); flex-shrink: 0;
}
.cz-arclim-picker-name {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 2px;
}
.cz-arclim-picker-title {
  font-family: var(--serif); font-size: 16px; font-weight: 500; color: var(--white);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cz-arclim-picker-sub {
  font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--w40); text-transform: uppercase;
}
.cz-arclim-picker-caret { font-size: 11px; color: var(--w40); transition: transform .2s; flex-shrink: 0; }
.cz-arclim-picker-btn.open .cz-arclim-picker-caret { transform: rotate(180deg); }

.cz-arclim-picker-menu {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 1300;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 6px; box-shadow: 0 18px 44px rgba(0,0,0,0.55);
  max-height: 360px; overflow-y: auto;
}
.cz-arclim-picker-group { padding: 8px 8px 2px; }
.cz-arclim-picker-group-label {
  font-family: var(--mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--w40); padding-bottom: 6px; border-bottom: 1px solid var(--border2); margin-bottom: 4px;
}
.cz-arclim-picker-item {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 7px; background: transparent; border: none;

<!-- ══ Data model ══ -->
<script>
(function(){
  'use strict';
  const COLORMAPS = {
    ndvi:  ['#6b4f2a','#a98f3e','#c9c24a','#7fae3a','#3d7a2e','#1c4d12'],
    ndwi:  ['#b9a06a','#d8c48f','#7fae9a','#3d9ec4','#2a6fad','#13315f'],
    bosque:['#2a2a24','#56583f','#7e8a4e','#4f8a34','#2f6b23','#16400f'],
    elev:  ['#1c4d12','#3d7a2e','#a98f3e','#b07a45','#8c6a52','#e7e3da'],
    clima: ['#2a6fad','#3d9ec4','#7fae6a','#c9c24a','#d98a3a','#c0392b'],
  };
  const MODULES = [
    { id:'vegetacion', label:'Vegetación',    icon:'fa-seedling',             type:'map',
      prefix:'vegetacion_', index:'NDVI', cmap:'ndvi', legendMin:'0.0', legendMax:'1.0',
      metrics:[
        {key:'mean',   label:'NDVI prom',  fmt:'dec', better:'high'},
        {key:'max',    label:'NDVI máx',   fmt:'dec', better:'high'},
        {key:'min',    label:'NDVI mín',   fmt:'dec', better:'none'},
        {key:'stdDev', label:'Desv. est.', fmt:'dec', better:'none'},
      ]},
    { id:'agua', label:'Agua', icon:'fa-droplet', type:'map',
      prefix:'agua_', index:'NDWI', cmap:'ndwi', legendMin:'-0.3', legendMax:'0.6',
      metrics:[
        {key:'mean', label:'NDWI prom', fmt:'dec', better:'high'},
        {key:'max',  label:'NDWI máx',  fmt:'dec', better:'high'},
        {key:'min',  label:'NDWI mín',  fmt:'dec', better:'none'},
      ]},
    { id:'elevacion', label:'Elevación', icon:'fa-mountain', type:'map',
      prefix:'dem_', index:'Elevación', cmap:'elev', legendMin:'baja', legendMax:'alta',
      metrics:[
        {key:'mean', label:'Elev. media', fmt:'int', unit:'m', better:'none'},
        {key:'max',  label:'Cota máxima', fmt:'int', unit:'m', better:'none'},
        {key:'min',  label:'Cota mínima', fmt:'int', unit:'m', better:'none'},
      ]},
    { id:'bosque', label:'Bosque', icon:'fa-tree', type:'map',
      prefix:'bosque_', index:'Cobertura', cmap:'bosque', legendMin:'0%', legendMax:'100%',
      metrics:[
        {key:'mean', label:'Cobertura prom', fmt:'dec', better:'high'},
        {key:'max',  label:'Cobertura máx',  fmt:'dec', better:'high'},
      ]},
    { id:'biodiversidad', label:'Biodiversidad', icon:'fa-paw', type:'bio',
      prefix:'biodiversidad_',
      tableTitle:'Riqueza de especies · GBIF + RCE Chile',
      rows:[
        {key:'n_especies', label:'Total especies',        fmt:'int', better:'high'},
        {key:'n_cr',       label:'En Peligro Crítico',    fmt:'int', better:'low'},
        {key:'n_en',       label:'En Peligro',            fmt:'int', better:'low'},
        {key:'n_vu',       label:'Vulnerables',           fmt:'int', better:'low'},
        {key:'n_rce',      label:'Catálogo RCE Chile',    fmt:'int', better:'high', accent:true},
      ]},
    { id:'riesgos', label:'Riesgos', icon:'fa-triangle-exclamation', type:'arclim',
      tableTitle:'Riesgos climáticos proyectados · ARClim · MMA / CR2 · UC',
      indicadores:[
        {id:'hot_days',             grupo:'calor',  icon:'fa-sun',              label:'Días calurosos',           unit:'días/año'},
        {id:'summer_days',          grupo:'calor',  icon:'fa-thermometer-full', label:'Días de verano',           unit:'días/año'},
        {id:'tropical_nights',      grupo:'calor',  icon:'fa-moon',             label:'Noches tropicales',        unit:'noches/año'},
        {id:'frost_days',           grupo:'frio',   icon:'fa-snowflake',        label:'Días de helada',           unit:'días/año'},
        {id:'cool_days',            grupo:'frio',   icon:'fa-wind',             label:'Días frescos',             unit:'días/año'},
        {id:'consecutive_dry_days', grupo:'sequia', icon:'fa-tint-slash',       label:'Días secos consecutivos',  unit:'días'},
        {id:'consecutive_wet_days', grupo:'lluvia', icon:'fa-cloud-rain',       label:'Días húmedos consecutivos',unit:'días'},
      ]},
  ];
  function polyFromGeoJSON(geo){
    if(!geo||!geo.geometry||geo.geometry.type!=='Polygon') return [];
    return geo.geometry.coordinates[0].map(function(c){return[c[1],c[0]];});
  }
  function boundsOfPoly(poly){
    if(!poly.length) return null;
    var lats=poly.map(function(p){return p[0];}), lngs=poly.map(function(p){return p[1];});
    return [[Math.min.apply(null,lats),Math.min.apply(null,lngs)],[Math.max.apply(null,lats),Math.max.apply(null,lngs)]];
  }
  function centroid(poly){
    if(!poly.length) return {lat:-35,lng:-71};
    var sumLat=0,sumLng=0;
    poly.forEach(function(p){sumLat+=p[0];sumLng+=p[1];});
    return {lat:sumLat/poly.length, lng:sumLng/poly.length};
  }
  function wsToZone(ws){
    var poly=polyFromGeoJSON(ws.polygon_geojson);
    var bounds=boundsOfPoly(poly);
    var c=centroid(poly);
    var d=new Date(ws.created_at);
    return {
      id:ws.id, name:ws.zone_name||'Zona sin nombre',
      region:'', date:d.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}),
      area:parseFloat(ws.zona_ha)||0, lat:c.lat, lng:c.lng, zoom:11, poly:poly, bounds:bounds,
    };
  }
  window.CZ={ZONES:[],MODULES,COLORMAPS,wsToZone};
})();
</script>

<!-- ══ Map helpers ══ -->
<script>
(function(){
  'use strict';
  function hexToRgb(h){var n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
  function rampColor(stops,t){
    t=Math.max(0,Math.min(1,t));
    var seg=t*(stops.length-1),i=Math.floor(seg),f=seg-i;
    var a=hexToRgb(stops[i]),b=hexToRgb(stops[Math.min(i+1,stops.length-1)]);
    return[Math.round(a[0]+(b[0]-a[0])*f),Math.round(a[1]+(b[1]-a[1])*f),Math.round(a[2]+(b[2]-a[2])*f)];
  }
  function legendGradient(cmapKey){
    var stops=CZ.COLORMAPS[cmapKey];
    var parts=stops.map(function(c,i){return c+' '+Math.round(i/(stops.length-1)*100)+'%';});
    return'linear-gradient(90deg,'+parts.join(',')+')';
  }
  function createBaseMap(el,zone){
    var center=zone&&zone.lat?[zone.lat,zone.lng]:[-37.5,-71];
    var zoom=zone&&zone.zoom?zone.zoom:9;
    var map=L.map(el,{center:center,zoom:zoom,zoomControl:true,attributionControl:true,zoomSnap:0.5,maxZoom:18,minZoom:5,fadeAnimation:false});
    // ESRI World Imagery (satélite) — mismo base que acceso-datos.html (consistencia)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
      attribution:'Tiles © Esri',
      maxZoom:18
    }).addTo(map);
    // Etiquetas semitransparentes sobre el satélite (ciudades, ríos, calles)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{
      opacity:0.7, maxZoom:18
    }).addTo(map);
    map.zoomControl.setPosition('topright');
    map.attributionControl.setPrefix('');
    return map;
  }
  async function drawZone(map,handles,zone,mod,accent,opacity,zoneData){
    if(handles.overlay){try{map.removeLayer(handles.overlay);}catch(e){}handles.overlay=null;}
    if(handles.poly){try{map.removeLayer(handles.poly);}catch(e){}handles.poly=null;}
    if(zone&&zone.poly&&zone.poly.length){
      handles.poly=L.polygon(zone.poly,{color:accent,weight:2,opacity:0.9,fillColor:accent,fillOpacity:0.05}).addTo(map);
    }
    if(mod&&mod.type==='map'&&zoneData&&zoneData[mod.id]){
      var md=zoneData[mod.id];
      if(md.previewPath&&md.previewBounds){
        try{
          var res=await supabase.storage.from('result-previews').createSignedUrl(md.previewPath,3600);
          if(res.data&&res.data.signedUrl){
            handles.overlay=L.imageOverlay(res.data.signedUrl,md.previewBounds,{opacity:opacity,interactive:false}).addTo(map);
          }
        }catch(e){console.warn('overlay error',e);}
      }
    }
  }
  function fitZone(map,zone,zoneData,modId){
    var b=null;
    if(zoneData&&modId&&zoneData[modId]&&zoneData[modId].previewBounds) b=zoneData[modId].previewBounds;
    else if(zone&&zone.bounds) b=zone.bounds;
    if(b) map.fitBounds(b,{padding:[18,18],animate:false});
    else if(zone&&zone.lat) map.setView([zone.lat,zone.lng],zone.zoom||10,{animate:false});
  }
  function linkSync(mapA,mapB,gate){
    var lock=false;
    function sync(src,dst){
      return function(){
        if(lock||!gate.enabled) return;
        lock=true;
        dst.setView(src.getCenter(),src.getZoom(),{animate:false});
        lock=false;
      };
    }
    var hA=sync(mapA,mapB),hB=sync(mapB,mapA);
    mapA.on('moveend',hA); mapB.on('moveend',hB);
    return function(){mapA.off('moveend',hA);mapB.off('moveend',hB);};
  }
  window.CZMap={legendGradient,createBaseMap,drawZone,fitZone,linkSync};
})();
</script>

<!-- ══ React app ══ -->
<script type="text/babel">
'use strict';
const {useState,useEffect,useRef,useMemo,useCallback}=React;

/* ── formatters ── */
function czFmt(v,fmt,unit){
  if(v==null||typeof v!=='number') return '—';
  if(fmt==='dec') return v.toFixed(2);
  if(fmt==='pct') return v+'%';
  if(fmt==='ha')  return Math.round(v).toLocaleString('es-CL')+' ha';
  if(fmt==='int') return Math.round(v).toLocaleString('es-CL')+(unit?' '+unit:'');
  return String(v);
}
function czFmtDelta(d,fmt,unit){
  var s=d>0?'+':d<0?'−':'';
  var a=Math.abs(d);
  if(fmt==='dec') return s+a.toFixed(2);
  if(fmt==='pct') return s+a+'%';
  if(fmt==='ha')  return s+Math.round(a).toLocaleString('es-CL')+' ha';
  if(fmt==='int') return s+Math.round(a).toLocaleString('es-CL')+(unit?' '+unit:'');
  return s+a;
}
function czDelta(a,b,better){
  if(a==null||b==null) return{arrow:'—',sentiment:'neutral',diff:0};
  var diff=b-a;
  var arrow=diff>0.0001?'▲':diff<-0.0001?'▼':'▬';
  var sentiment='neutral';
  if(better==='high') sentiment=diff>0?'good':diff<0?'bad':'neutral';
  if(better==='low')  sentiment=diff<0?'good':diff>0?'bad':'neutral';
  return{arrow,sentiment,diff};
}
const sentColor=s=>s==='good'?'var(--data)':s==='bad'?'var(--neg)':'var(--w55)';

/* ── zone selector ── */
function ZoneSelect({side,zone,otherId,onPick,zones}){
  const[open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    function h(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);
  return(
    <div className={'cz-zsel cz-zsel--'+side} ref={ref}>
      <button className={'cz-zsel-btn'+(open?' open':'')} onClick={()=>setOpen(!open)}>
        <span className={'cz-zchip cz-zchip--'+side}>{side.toUpperCase()}</span>
        <span className="cz-zsel-name">
          <span className="cz-zsel-title">{zone?zone.name:'Seleccionar zona'}</span>
          {zone&&<span className="cz-zsel-meta">{zone.area.toLocaleString('es-CL')} ha</span>}
        </span>
        <i className="fa-solid fa-chevron-down cz-zsel-caret"/>
      </button>
      {open&&(
        <div className="cz-zsel-menu">
          {zones.length===0&&<div className="cz-nodata" style={{padding:'16px'}}><i className="fa-solid fa-map-marked-alt"/>Sin zonas disponibles</div>}
          {zones.map(z=>(
            <button key={z.id} className={'cz-zsel-item'+(z.id===zone?.id?' sel':'')}
              onClick={()=>{onPick(z.id);setOpen(false);}}>
              <span className="cz-zsel-item-title">
                {z.name}
                {z.id===otherId&&<span className="cz-zsel-dup">en uso</span>}
              </span>
              <span className="cz-zsel-item-meta">{z.area.toLocaleString('es-CL')} ha · {z.date}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── KPI card ── */
const KPIS=[
  {id:'ndvi',label:'NDVI prom',icon:'fa-seedling',mod:'vegetacion',key:'mean',fmt:'dec',better:'high'},
  {id:'ndwi',label:'NDWI prom',icon:'fa-droplet', mod:'agua',      key:'mean',fmt:'dec',better:'high'},
  {id:'elev',label:'Elevación', icon:'fa-mountain',mod:'elevacion', key:'mean',fmt:'int',unit:'m',better:'none'},
  {id:'esp', label:'Especies',  icon:'fa-paw',     mod:'biodiversidad',key:'n_especies',fmt:'int',better:'high'},
];
function KpiCard({kpi,dataA,dataB}){
  const get=d=>d&&d[kpi.mod]&&d[kpi.mod][kpi.key]!=null?d[kpi.mod][kpi.key]:null;
  const va=get(dataA),vb=get(dataB);
  const pct=va&&vb!=null?Math.round((vb-va)/Math.abs(va)*100):null;
  const arrow=va==null||vb==null?null:vb>va?'▲':vb<va?'▼':'▬';
  const {sentiment}=czDelta(va,vb,kpi.better);
  const col=sentColor(sentiment);
  return(
    <div className="cz-kpi">
      <div className="cz-kpi-head"><i className={'fa-solid '+kpi.icon}/>{kpi.label}</div>
      <div className="cz-kpi-flow">
        <span className="cz-kpi-num cz-kpi-num--a">{czFmt(va,kpi.fmt,kpi.unit)}</span>

  const valCol=isLead=>m.better==='none'?'var(--white)':isLead?'var(--data)':'var(--w70)';
  const sc=sentColor(sentiment);
  return(
    <div className="cz-metric">

/* ══ ARCLIM dashboard (Riesgos) ══ */
const ARCLIM_BASE='https://evergreen-backend-awv1.onrender.com';
const _arclimCache={comunas:null, series:{}};

function _normalizarTxt(s){
  return String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}

async function fetchArclimComunas(){
  if(_arclimCache.comunas) return _arclimCache.comunas;
  const r=await fetch(ARCLIM_BASE+'/api/arclim/comunas');
  const j=await r.json();
  _arclimCache.comunas=j.comunas||[];
  return _arclimCache.comunas;
}

async function detectComunaForZone(zone){
  if(!zone||!zone.poly||!zone.poly.length) return null;
  let lat=0,lng=0;
  zone.poly.forEach(p=>{lat+=p[0];lng+=p[1];});
  lat/=zone.poly.length; lng/=zone.poly.length;
  try{
    const nom=await fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lng+'&format=json&accept-language=es&zoom=10',{headers:{'User-Agent':'Evergreen/1.0'}}).then(r=>r.json());
    const a=nom.address||{};
    const nombre=a.city||a.town||a.village||a.municipality||(a.county||'').replace(/^Provincia\s+de\s+/i,'');
    if(!nombre) return null;
    const lista=await fetchArclimComunas();
    const norm=_normalizarTxt(nombre);
    let hit=lista.find(c=>_normalizarTxt(c.nombre)===norm);
    if(!hit) hit=lista.find(c=>_normalizarTxt(c.nombre).indexOf(norm)>=0||norm.indexOf(_normalizarTxt(c.nombre))>=0);
    return hit?{arclim_id:hit.arclim_id,nombre:hit.nombre,raw:nombre}:{arclim_id:null,nombre:nombre,raw:nombre};
  }catch(e){return null;}
}

async function fetchArclimSerie(indId, arclimId){
  const key=indId+'|'+arclimId;
  if(_arclimCache.series[key]) return _arclimCache.series[key];
  const url=ARCLIM_BASE+'/api/arclim/serie?id='+indId+'&key='+arclimId+'&scenario=ssp585&season=annual';
  const r=await fetch(url);
  if(!r.ok) throw new Error('arclim '+r.status);
  const j=await r.json();
  _arclimCache.series[key]=j;
  return j;
}

    }

        },

          tooltip:{titleFont:{family:'DM Mono'},bodyFont:{family:'DM Mono'},callbacks:{title:items=>'Año '+items[0].label}},

        }

    return()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}};

function ArclimDeltaCard({side,zone,comuna,serie,indicador}){
  const tag=side==='a'?'A':'B';
  const cls=side==='a'?'za':'zb';
  if(!serie){
    return(
      <div className={'cz-arclim-comuna '+cls}>
        <span className={'cz-zchip cz-zchip--'+side}>{tag}</span>
        <div className="cz-arclim-comuna-info">
          <span className="cz-arclim-comuna-label">Zona {tag}</span>
          <span className="cz-arclim-comuna-name">{zone?zone.name:'—'}</span>
          <span className="cz-arclim-comuna-state">
            {comuna?(comuna.arclim_id?('Comuna: '+comuna.nombre):('Comuna ARClim no encontrada · '+comuna.raw)):'Detectando…'}
          </span>
        </div>
      </div>
    );
  }
  const years=serie.years||[];
  const mean=serie.mean||[];
  const histIdx=years.map((y,i)=>y>=1980&&y<=2010?i:-1).filter(i=>i>=0);
  const futIdx =years.map((y,i)=>y>=2035&&y<=2065?i:-1).filter(i=>i>=0);
  const avg=arr=>arr.length?arr.reduce((s,v)=>s+v,0)/arr.length:null;
  const hist=avg(histIdx.map(i=>mean[i]));
  const fut =avg(futIdx.map(i=>mean[i]));
  const diff=hist!=null&&fut!=null?fut-hist:null;
  const fmt=v=>v==null?'—':v.toFixed(1);
  return(
    <div className={'cz-arclim-comuna '+cls}>
      <span className={'cz-zchip cz-zchip--'+side}>{tag}</span>
      <div className="cz-arclim-comuna-info">
        <span className="cz-arclim-comuna-label">Zona {tag} · {comuna?.nombre||'—'}</span>
        <span className="cz-arclim-comuna-name">{indicador?.label}</span>
        <div className="cz-arclim-delta-vals" style={{marginTop:4}}>
          <span>{fmt(hist)}</span>
          <i className="fa-solid fa-arrow-right-long"/>
          <span>{fmt(fut)}</span>
          <span style={{marginLeft:'auto',color:diff>0?'var(--neg)':diff<0?'var(--data)':'var(--w55)',fontSize:11}}>
            {diff==null?'':(diff>0?'▲ +':'▼ ')+Math.abs(diff).toFixed(1)+' '+(indicador?.unit||'')}
          </span>
        </div>
      </div>
    </div>
  );
}

function ArclimDashboard({mod,zoneA,zoneB}){
  const[indId,setIndId]=useState('hot_days');
  const[comunaA,setComunaA]=useState(null);
  const[comunaB,setComunaB]=useState(null);
  const[serieA,setSerieA]=useState(null);
  const[serieB,setSerieB]=useState(null);
  const[loading,setLoading]=useState(false);
  const indicador=useMemo(()=>mod.indicadores.find(i=>i.id===indId),[indId,mod]);

  // detect comuna when zone changes
  useEffect(()=>{(async()=>{if(zoneA){const c=await detectComunaForZone(zoneA);setComunaA(c);}else setComunaA(null);})();},[zoneA?.id]);
  useEffect(()=>{(async()=>{if(zoneB){const c=await detectComunaForZone(zoneB);setComunaB(c);}else setComunaB(null);})();},[zoneB?.id]);

  // fetch series when indicator or comuna changes
  useEffect(()=>{
    let cancel=false;
    (async()=>{
      setLoading(true);
      setSerieA(null);setSerieB(null);
      try{
        const tasks=[];
        if(comunaA&&comunaA.arclim_id) tasks.push(fetchArclimSerie(indId,comunaA.arclim_id).then(s=>{if(!cancel)setSerieA(s);}).catch(()=>{}));
        if(comunaB&&comunaB.arclim_id) tasks.push(fetchArclimSerie(indId,comunaB.arclim_id).then(s=>{if(!cancel)setSerieB(s);}).catch(()=>{}));
        await Promise.all(tasks);
      }finally{ if(!cancel) setLoading(false); }
    })();
    return()=>{cancel=true;};
  },[indId,comunaA?.arclim_id,comunaB?.arclim_id]);

  const grupos={calor:'Calor',frio:'Frío',sequia:'Sequía',lluvia:'Lluvia'};

  return(
    <div className="cz-arclim">

          <i className={'fa-solid '+mod.icon}/>{mod.label} · ARClim (MMA · CR2 · UC)

        <ArclimDeltaCard side="a" zone={zoneA} comuna={comunaA} serie={serieA} indicador={indicador}/>
        <ArclimDeltaCard side="b" zone={zoneB} comuna={comunaB} serie={serieB} indicador={indicador}/>
      </div>

      <IndicadorPicker indicadores={mod.indicadores} value={indId} onChange={setIndId}/>

      <div className="cz-arclim-chart-wrap">
        <div className="cz-arclim-chart-head">
          <div>
            <div className="cz-arclim-chart-title">{indicador?.label}</div>
            <div className="cz-arclim-chart-sub">{grupos[indicador?.grupo]||''} · {indicador?.unit} · 1980 — 2065</div>
          </div>
          <div className="cz-arclim-chart-legend">
            <span><i style={{background:'#C8A882'}}/>Zona A</span>
            <span><i style={{background:'#6AAA35'}}/>Zona B</span>
          </div>
        </div>
        {loading
          ?<div className="cz-arclim-loading"><div className="cz-boot-spin"/>Cargando series climáticas…</div>
          :(serieA||serieB)
            ?<ArclimChart serieA={serieA} serieB={serieB} zoneA={zoneA} zoneB={zoneB} indicador={indicador}/>
            :<div className="cz-nodata"><i className="fa-solid fa-triangle-exclamation"/>Sin datos ARClim para las comunas detectadas</div>
        }
      </div>
    </div>
  );
}

/* ══ MAP TILE (imperative Leaflet, managed with refs) ══ */
function MapTile({side,zone,mod,zoneData,syncGate}){
  const elRef=useRef(null);
  const mapRef=useRef(null);
  const handlesRef=useRef({});
  const built=useRef(false);

  // init map once
  useEffect(()=>{
    if(!elRef.current||built.current) return;
    mapRef.current=CZMap.createBaseMap(elRef.current,zone);
    built.current=true;
    setTimeout(()=>{if(mapRef.current)mapRef.current.invalidateSize();},200);
    setTimeout(()=>{if(mapRef.current)mapRef.current.invalidateSize();},600);
    return()=>{
      if(mapRef.current){try{mapRef.current.remove();}catch(e){}}
      mapRef.current=null; built.current=false;
    };
  },[]);

  // expose map ref for sync
  useEffect(()=>{
    if(syncGate&&mapRef.current) syncGate.setMap(side,mapRef.current);
    return()=>{if(syncGate) syncGate.setMap(side,null);};
  },[syncGate]);

  // update zone + overlay when zone / mod / data changes
  useEffect(()=>{
    if(!mapRef.current||!built.current) return;
    const accent=side==='a'?'#C8A882':'#6AAA35';
    (async()=>{
      await CZMap.drawZone(mapRef.current,handlesRef.current,zone,mod,accent,0.82,zoneData);
      CZMap.fitZone(mapRef.current,zone,zoneData,mod&&mod.id);
      setTimeout(()=>{if(mapRef.current)mapRef.current.invalidateSize();},100);
    })();
  },[zone?.id,mod?.id,zoneData]);

  const hasMap=mod&&mod.type==='map';
  const hasData=zoneData&&mod&&zoneData[mod.id];

  return(
    <section className="cz-tile">
      <header className={'cz-tile-head cz-tile-head--'+side}>
        <span className={'cz-zchip cz-zchip--'+side}>{side.toUpperCase()}</span>
        <span className="cz-tile-name">{zone?zone.name:'Sin zona seleccionada'}</span>
        {zone&&<span className="cz-tile-meta">{zone.area.toLocaleString('es-CL')} ha · {zone.date}</span>}
      </header>
      <div className="cz-tile-body">
        {!zone&&(
          <div className="cz-tile-empty">
            <i className="fa-solid fa-map-marked-alt"/>
            Selecciona una zona
          </div>
        )}
        {zone&&hasMap&&!hasData&&(
          <div className="cz-tile-empty">
            <i className="fa-solid fa-image-slash"/>
            Sin imagen para este módulo
          </div>
        )}
        <div className="cz-map" ref={elRef} style={{display:zone?undefined:'none'}}/>
        {zone&&hasMap&&hasData&&<MapLegend mod={mod}/>}
      </div>
    </section>
  );
}

/* ══ MAIN APP ══ */
function App({session,plan,zones}){
  const[zoneAId,setZoneAId]=useState(zones[0]?.id||null);
  const[zoneBId,setZoneBId]=useState(zones[1]?.id||null);
  const[modId,setModId]=useState('vegetacion');
  const[dataCache,setDataCache]=useState({});
  const syncMapsRef=useRef({a:null,b:null,unlink:null});

  const zoneA=useMemo(()=>zones.find(z=>z.id===zoneAId)||null,[zoneAId,zones]);
  const zoneB=useMemo(()=>zones.find(z=>z.id===zoneBId)||null,[zoneBId,zones]);
  const mod=useMemo(()=>CZ.MODULES.find(m=>m.id===modId),[modId]);
  const dataA=zoneAId?dataCache[zoneAId]?.data||null:null;
  const dataB=zoneBId?dataCache[zoneBId]?.data||null:null;

  // load zone results from Supabase
  const loadZoneData=useCallback(async(wsId)=>{
    if(!wsId||dataCache[wsId]) return;
    setDataCache(prev=>({...prev,[wsId]:{loading:true}}));
    try{
      const{data:rows}=await supabase.from('results').select('tipo_indice,result_data').eq('workspace_id',wsId);
      const parsed={};
      (rows||[]).forEach(row=>{
        const modDef=CZ.MODULES.find(m=>row.tipo_indice&&row.tipo_indice.startsWith(m.prefix));
        if(!modDef||!row.result_data||!row.result_data.length) return;
        const item=row.result_data.reduce((a,b)=>((a.ts||0)>(b.ts||0)?a:b));
        parsed[modDef.id]={...(item.stats||{}),previewPath:item.previewPath,previewBounds:item.previewBounds};
      });
      setDataCache(prev=>({...prev,[wsId]:{loading:false,data:parsed}}));
    }catch(e){
      console.error('loadZoneData',e);
      setDataCache(prev=>({...prev,[wsId]:{loading:false,data:{}}}));
    }
  },[dataCache]);

  useEffect(()=>{if(zoneAId) loadZoneData(zoneAId);},[zoneAId]);
  useEffect(()=>{if(zoneBId) loadZoneData(zoneBId);},[zoneBId]);

  // map sync gate — default OFF (cada mapa se mueve independiente).
  // Se puede activar con el toggle "Sincronizar mapas" en la topbar.
  const [syncOn,setSyncOn]=useState(false);
  const syncGate=useMemo(()=>({
    enabled:false,  // se sobrescribe abajo con useEffect
    setMap:(side,map)=>{
      syncMapsRef.current[side]=map;
      if(syncMapsRef.current.unlink){syncMapsRef.current.unlink();syncMapsRef.current.unlink=null;}
      if(syncMapsRef.current.a&&syncMapsRef.current.b){
        syncMapsRef.current.unlink=CZMap.linkSync(syncMapsRef.current.a,syncMapsRef.current.b,syncGate);
      }
    }
  }),[]);
  // Sincronizar estado React con el gate (sin re-crear los listeners)
  useEffect(()=>{ syncGate.enabled=syncOn; },[syncOn,syncGate]);

  const isMapMode=mod&&mod.type==='map';
  const isBio=mod&&mod.type==='bio';
  const isArclim=mod&&mod.type==='arclim';

  const goReanalyze=useCallback(()=>{window.open('acceso-datos.html','_self');},[]);

  return(
    <div className="cz-root">
      {/* TOPBAR */}
      <header className="cz-topbar">
        <a className="cz-back" href="acceso-datos.html">
          <i className="fa-solid fa-arrow-left"/>
          <img src="img/logo3.png" alt="Monitor Pro" className="cz-logo"/>
        </a>
        <div className="cz-title">
          <span className="cz-title-main">MONITOR PRO</span>
          <span className="cz-title-eyebrow">Módulo Comparativo</span>
        </div>
        <div className="cz-topbar-right">
          {isMapMode&&(
            <label className="cz-sync-toggle" title="Sincroniza pan/zoom entre ambos mapas">
              <input type="checkbox" checked={syncOn} onChange={e=>setSyncOn(e.target.checked)}/>
              <span className="cz-sync-track"><span className="cz-sync-dot"/></span>
              <span className="cz-sync-label">Sincronizar mapas</span>
            </label>
          )}
          <span className="cz-plan-tag">{plan}</span>
        </div>
      </header>

      {/* BODY */}
      <div className="cz-body">
        {/* SIDEBAR */}
        <aside className="cz-sidebar">
          <div className="cz-side-group">
            <div className="cz-side-label">Zona A</div>
            <ZoneSelect side="a" zone={zoneA} otherId={zoneBId} onPick={setZoneAId} zones={zones}/>
          </div>
          <div className="cz-side-group">
            <div className="cz-side-label">Zona B</div>
            <ZoneSelect side="b" zone={zoneB} otherId={zoneAId} onPick={setZoneBId} zones={zones}/>
          </div>
          <div className="cz-side-divider"/>
          <nav className="cz-modrail">
            <div className="cz-side-label">Módulo de análisis</div>
            {CZ.MODULES.map(m=>(
              <button key={m.id} className={'cz-modtab'+(m.id===modId?' active':'')} onClick={()=>setModId(m.id)}>
                <span className="cz-modtab-radio"/>
                <i className={'fa-solid '+m.icon}/>
                <span>{m.label}</span>
                {m.type!=='map'&&<span className="cz-tab-dot" title="Datos no-raster"/>}
              </button>
            ))}
          </nav>
        </aside>

        {/* CANVAS */}
        <main className="cz-canvas">
          {/* KPIs */}
          <div className="cz-kpis">
            {KPIS.map(k=><KpiCard key={k.id} kpi={k} dataA={dataA} dataB={dataB}/>)}
          </div>

          {/* Stage */}
          <div className="cz-stage">
            {isMapMode&&(
              <div className="cz-tiles">
                <MapTile side="a" zone={zoneA} mod={mod} zoneData={dataA} syncGate={syncGate}/>
                <MapTile side="b" zone={zoneB} mod={mod} zoneData={dataB} syncGate={syncGate}/>
              </div>
            )}

            <div className="cz-detail">
              {isArclim
                ?<ArclimDashboard mod={mod} zoneA={zoneA} zoneB={zoneB}/>
                :isBio
                  ?<BioCompare mod={mod} zoneA={zoneA} zoneB={zoneB} dataA={dataA} dataB={dataB} onReanalyze={goReanalyze}/>
                  :(
                    <>
                      <div className="cz-detail-head">
                        <span className="cz-detail-eyebrow">
                          <i className={'fa-solid '+mod.icon}/>{mod.label}{mod.index?' · '+mod.index:''}
                        </span>
                        <span className="cz-detail-note">Δ = Zona B − Zona A</span>
                      </div>
                      <MetricsRow mod={mod} dataA={dataA} dataB={dataB}/>
                      {mod.id==='vegetacion'&&<PisoStrip dataA={dataA} dataB={dataB}/>}
                    </>
                  )
              }
            </div>
          </div>
        </main>
      </div>
    </div>
  );
}

function UpgradeWall(){
  return(
    <div className="cz-upgrade">
      <div className="cz-upgrade-card">
        <div className="cz-upgrade-icon"><i className="fa-solid fa-layer-group"/></div>
        <div className="cz-upgrade-title">Disponible en Plan Pro</div>
        <div className="cz-upgrade-text">
          El Módulo Comparativo requiere plan <strong>Pro</strong> o <strong>Enterprise</strong> para acceder a múltiples zonas de estudio.
        </div>
        <a href="acceso-datos.html" className="cz-upgrade-btn">
          <i className="fa-solid fa-arrow-left"/> Volver al Workspace
        </a>
      </div>
    </div>
  );
}

function Loading({msg}){
  return(
    <div className="cz-boot">
      <div className="cz-boot-spin"/>
      {msg||'Cargando…'}
    </div>
  );
}

/* ══ Bootstrap ══ */
const rootEl=ReactDOM.createRoot(document.getElementById('root'));

async function bootstrap(){
  rootEl.render(<Loading msg="Iniciando sesión…"/>);
  document.body.style.visibility='visible';

  const{data:{session}}=await supabase.auth.getSession();
  if(!session){window.location.href='login.html';return;}

  rootEl.render(<Loading msg="Verificando acceso…"/>);
  const{data:quota}=await supabase.from('user_quotas').select('plan,is_active').eq('user_id',session.user.id).single();
  const plan=(quota&&quota.plan)||'free';

  if(plan==='free'){rootEl.render(<UpgradeWall/>);return;}

  rootEl.render(<Loading msg="Cargando zonas de estudio…"/>);
  // FIX: cargar TODAS las zonas del usuario con polígono, no solo la activa.
  // El constraint UNIQUE idx_workspaces_one_active_per_user permite solo
  // 1 zona is_active=true por user_id; filtrar por is_active bloqueaba la comparación.
  const{data:wsList}=await supabase.from('workspaces').select('id,zone_name,zona_ha,created_at,polygon_geojson,is_active').eq('user_id',session.user.id).not('polygon_geojson','is',null).order('created_at',{ascending:false});

  CZ.ZONES=(wsList||[]).map(CZ.wsToZone);
  rootEl.render(<App session={session} plan={plan} zones={CZ.ZONES}/>);
}

bootstrap().catch(err=>{
  console.error(err);
  rootEl.render(<div style={{color:'var(--neg)',padding:'40px',fontFamily:'var(--mono)',fontSize:'12px'}}>Error: {String(err)}</div>);
});
</script>
