        <span className={'cz-zchip cz-zchip--'+side}>{side.toUpperCase()}</span>
        <span className="cz-bio-donut-name">{zoneName||'—'}</span>
        <span className="cz-bio-donut-total">{data.n_especies||0} spp</span>
      </div>
      <div className="cz-bio-donut-canvas"><canvas ref={ref}/></div>
    </div>
  );
}

/* ── NUEVO: top amenazadas comparativa (qué hay en cada zona, qué se comparte) ── */
function BioTopComparison({dataA,dataB,zoneA,zoneB}){
  const topA=(dataA&&dataA.top_amenazadas)||[];
  const topB=(dataB&&dataB.top_amenazadas)||[];
  if(topA.length===0&&topB.length===0) return null;

  // Normaliza nombre para encontrar especies compartidas
  const norm=s=>String(s||'').toLowerCase().trim();
  const setA=new Set(topA.map(s=>norm(s.nombre)));
  const setB=new Set(topB.map(s=>norm(s.nombre)));
  const shared=topA.filter(s=>setB.has(norm(s.nombre))).map(s=>s.nombre);

  return(
    <div className="cz-bio-top-section">
      <div className="cz-table-head">
        <i className="fa-solid fa-shield-cat"/>Top especies amenazadas
        {shared.length>0&&<span className="cz-bio-shared-pill">{shared.length} compartida{shared.length>1?'s':''}</span>}
      </div>
      <div className="cz-bio-top-grid">
        <div className="cz-bio-top-col">
          <div className="cz-bio-top-col-head"><span className="cz-zchip cz-zchip--a">A</span>{zoneA?.name||'—'}</div>
          {topA.slice(0,5).map((s,i)=>{
            const isShared=setB.has(norm(s.nombre));
            return(
              <div key={i} className={'cz-bio-top-row'+(isShared?' shared':'')}>
                <span className={'cz-bio-top-cat '+(s.cat||s.iucn||'NT')}>{s.cat||s.iucn||'NT'}</span>
                <span className="cz-bio-top-name">{s.comun?s.comun.split(',')[0]:s.nombre}</span>
                {isShared&&<i className="fa-solid fa-link cz-bio-top-share" title="También en Zona B"/>}
              </div>
            );
          })}
          {topA.length===0&&<div className="cz-bio-top-empty">Sin amenazadas</div>}
        </div>
        <div className="cz-bio-top-col">
          <div className="cz-bio-top-col-head"><span className="cz-zchip cz-zchip--b">B</span>{zoneB?.name||'—'}</div>
          {topB.slice(0,5).map((s,i)=>{
            const isShared=setA.has(norm(s.nombre));
            return(
              <div key={i} className={'cz-bio-top-row'+(isShared?' shared':'')}>
                <span className={'cz-bio-top-cat '+(s.cat||s.iucn||'NT')}>{s.cat||s.iucn||'NT'}</span>
                <span className="cz-bio-top-name">{s.comun?s.comun.split(',')[0]:s.nombre}</span>
                {isShared&&<i className="fa-solid fa-link cz-bio-top-share" title="También en Zona A"/>}
              </div>
            );
          })}
          {topB.length===0&&<div className="cz-bio-top-empty">Sin amenazadas</div>}
        </div>
      </div>
    </div>
  );
}

/* ══ ARCLIM dashboard (Riesgos) ══ */
const ARCLIM_BASE='https://evergreen-backend-awv1.onrender.com';
const _arclimCache={comunas:null, series:{}};

function _normalizarTxt(s){
  return String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}

async function fetchArclimComunas(){
  if(_arclimCache.comunas) return _arclimCache.comunas;
  const r=await fetch(ARCLIM_BASE+'/api/arclim/comunas');
  const j=await r.json();
  _arclimCache.comunas=j.comunas||[];
  return _arclimCache.comunas;
}

async function detectComunaForZone(zone){
  if(!zone||!zone.poly||!zone.poly.length) return null;
  let lat=0,lng=0;
  zone.poly.forEach(p=>{lat+=p[0];lng+=p[1];});
  lat/=zone.poly.length; lng/=zone.poly.length;
  try{
    const nom=await fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lng+'&format=json&accept-language=es&zoom=10',{headers:{'User-Agent':'Evergreen/1.0'}}).then(r=>r.json());
    const a=nom.address||{};
    const nombre=a.city||a.town||a.village||a.municipality||(a.county||'').replace(/^Provincia\s+de\s+/i,'');
    if(!nombre) return null;
    const lista=await fetchArclimComunas();
    const norm=_normalizarTxt(nombre);
    let hit=lista.find(c=>_normalizarTxt(c.nombre)===norm);
    if(!hit) hit=lista.find(c=>_normalizarTxt(c.nombre).indexOf(norm)>=0||norm.indexOf(_normalizarTxt(c.nombre))>=0);
    return hit?{arclim_id:hit.arclim_id,nombre:hit.nombre,raw:nombre}:{arclim_id:null,nombre:nombre,raw:nombre};
  }catch(e){return null;}
}

async function fetchArclimSerie(indId, arclimId){
  const key=indId+'|'+arclimId;
  if(_arclimCache.series[key]) return _arclimCache.series[key];
  const url=ARCLIM_BASE+'/api/arclim/serie?id='+indId+'&key='+arclimId+'&scenario=ssp585&season=annual';
  const r=await fetch(url);
  if(!r.ok) throw new Error('arclim '+r.status);
  const j=await r.json();
  _arclimCache.series[key]=j;
  return j;
}

function ArclimChart({serieA,serieB,zoneA,zoneB,indicador,showSims}){
  const ref=useRef(null);
  const chartRef=useRef(null);
  useEffect(()=>{
    if(!ref.current||typeof Chart==='undefined') return;
    // Registrar plugin annotation (mismo patrón que workspace-arclim.js)
    if(window['chartjs-plugin-annotation']&&!Chart.registry.plugins.get('annotation')){
      Chart.register(window['chartjs-plugin-annotation']);
    }
    if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}

    const years=(serieA&&serieA.years)||(serieB&&serieB.years)||[];
    const datasets=[];

    // Helper: calcula índice de un año en el array (para las bandas annotation)
    const yearIdx=(y)=>{
      if(!years.length) return null;
      let best=0, bestDiff=Infinity;
      for(let i=0;i<years.length;i++){
        const d=Math.abs(Number(years[i])-y);
        if(d<bestDiff){bestDiff=d;best=i;}
      }
      return best;
    };
    const histStart=yearIdx(1980), histEnd=yearIdx(2010);
    const futStart =yearIdx(2035), futEnd =yearIdx(2065);

    // Simulaciones individuales (líneas finas) — solo si showSims=true
    if(showSims){
      if(serieA&&serieA.series){
        serieA.series.forEach(s=>{
          datasets.push({
            data:s, borderColor:'rgba(200,168,130,0.18)', borderWidth:0.7,
            pointRadius:0, pointHoverRadius:0, tension:0.2, fill:false, order:3,
            label:'_simA', _isSim:true,
          });
        });
      }
      if(serieB&&serieB.series){
        serieB.series.forEach(s=>{
          datasets.push({
            data:s, borderColor:'rgba(106,170,53,0.18)', borderWidth:0.7,
            pointRadius:0, pointHoverRadius:0, tension:0.2, fill:false, order:3,
            label:'_simB', _isSim:true,
          });
        });
      }
    }

    // Líneas promedio (siempre visibles)
    if(serieA&&serieA.mean){
      datasets.push({
        label:(zoneA&&zoneA.name)||'Zona A',
        data:serieA.mean,
        borderColor:'#C8A882', backgroundColor:'#C8A882',
        borderWidth:2.4, pointRadius:1.4, pointHoverRadius:4,
        tension:0.18, fill:false, order:1,
      });
    }
    if(serieB&&serieB.mean){
      datasets.push({
        label:(zoneB&&zoneB.name)||'Zona B',
        data:serieB.mean,
        borderColor:'#6AAA35', backgroundColor:'#6AAA35',
        borderWidth:2.4, pointRadius:1.4, pointHoverRadius:4,
        tension:0.18, fill:false, order:1,
      });
    }

    chartRef.current=new Chart(ref.current,{
      type:'line',
      data:{labels:years,datasets:datasets},
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{
            labels:{
              color:'rgba(29,43,29,0.78)', font:{family:'DM Mono',size:10.5},
              usePointStyle:true, boxWidth:8,
              // Ocultar los datasets _isSim de la legend (no queremos 40 entradas)
              filter:(item,chartData)=>{
                const ds=chartData.datasets[item.datasetIndex];
                return !ds._isSim;
              }
            }
          },
          tooltip:{
            titleFont:{family:'DM Mono'}, bodyFont:{family:'DM Mono'},
            callbacks:{
              title:items=>'Año '+Math.round(items[0].label),
              // No mostrar simulaciones individuales en el tooltip — saturan
              label:function(ctx){
                if(ctx.dataset._isSim) return null;
                return ctx.dataset.label+': '+Number(ctx.parsed.y).toFixed(1)+(indicador?.unit?' '+indicador.unit:'');
              }
            }
          },
          annotation:{
            annotations:{
              histBand:histStart!=null&&histEnd!=null?{
                type:'box', xMin:histStart, xMax:histEnd,
                backgroundColor:'rgba(120,170,220,0.10)',
                borderColor:'rgba(120,170,220,0.22)', borderWidth:1,
                label:{display:true, content:'1980 – 2010', position:'start',
                  font:{family:'DM Mono',size:9}, color:'rgba(120,170,220,0.7)',
                  backgroundColor:'transparent', padding:4, yAdjust:-4}
              }:null,
              futBand:futStart!=null&&futEnd!=null?{
                type:'box', xMin:futStart, xMax:futEnd,
                backgroundColor:'rgba(240,170,90,0.10)',
                borderColor:'rgba(240,170,90,0.22)', borderWidth:1,
                label:{display:true, content:'2035 – 2065', position:'start',
                  font:{family:'DM Mono',size:9}, color:'rgba(240,170,90,0.75)',
                  backgroundColor:'transparent', padding:4, yAdjust:-4}
              }:null,
            }
          }
        },
        scales:{
          x:{
            ticks:{
              color:'rgba(29,43,29,0.55)', font:{family:'DM Mono',size:10},
              maxTicksLimit:8,
              callback:(val,idx)=>years[idx]?Math.round(years[idx]):''
            },
            grid:{color:'rgba(31,61,28,0.09)'}
          },
          y:{
            ticks:{color:'rgba(29,43,29,0.55)',font:{family:'DM Mono',size:10}},
            grid:{color:'rgba(31,61,28,0.09)'},
            title:{display:true, text:indicador?.unit||'', color:'rgba(29,43,29,0.44)', font:{family:'DM Mono',size:10}}
          }
        }
      }
    });
    return()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}};
  },[serieA,serieB,zoneA?.id,zoneB?.id,showSims,indicador]);
  return<div className="cz-arclim-chart-canvas"><canvas ref={ref}/></div>;
}

function ArclimDeltaCard({side,zone,comuna,serie,indicador}){
  const tag=side==='a'?'A':'B';
  const cls=side==='a'?'za':'zb';
  if(!serie){
    return(
      <div className={'cz-arclim-comuna '+cls}>
        <span className={'cz-zchip cz-zchip--'+side}>{tag}</span>
        <div className="cz-arclim-comuna-info">
          <span className="cz-arclim-comuna-label">Zona {tag}</span>
          <span className="cz-arclim-comuna-name">{zone?zone.name:'—'}</span>
          <span className="cz-arclim-comuna-state">
            {comuna?(comuna.arclim_id?('Comuna: '+comuna.nombre):('Comuna ARClim no encontrada · '+comuna.raw)):'Detectando…'}
          </span>
        </div>
      </div>
    );
  }
  const years=serie.years||[];
  const mean=serie.mean||[];
  const histIdx=years.map((y,i)=>y>=1980&&y<=2010?i:-1).filter(i=>i>=0);
  const futIdx =years.map((y,i)=>y>=2035&&y<=2065?i:-1).filter(i=>i>=0);
  const avg=arr=>arr.length?arr.reduce((s,v)=>s+v,0)/arr.length:null;
  const hist=avg(histIdx.map(i=>mean[i]));
  const fut =avg(futIdx.map(i=>mean[i]));
  const diff=hist!=null&&fut!=null?fut-hist:null;
  const fmt=v=>v==null?'—':v.toFixed(1);
  return(
    <div className={'cz-arclim-comuna '+cls}>
      <span className={'cz-zchip cz-zchip--'+side}>{tag}</span>
      <div className="cz-arclim-comuna-info">
        <span className="cz-arclim-comuna-label">Zona {tag} · {comuna?.nombre||'—'}</span>
        <span className="cz-arclim-comuna-name">{indicador?.label}</span>
        <div className="cz-arclim-delta-vals" style={{marginTop:4}}>
          <span>{fmt(hist)}</span>
          <i className="fa-solid fa-arrow-right-long"/>
          <span>{fmt(fut)}</span>
          <span style={{marginLeft:'auto',color:diff>0?'var(--neg)':diff<0?'var(--data)':'var(--w55)',fontSize:11}}>
            {diff==null?'':(diff>0?'▲ +':'▼ ')+Math.abs(diff).toFixed(1)+' '+(indicador?.unit||'')}
          </span>
        </div>
      </div>
    </div>
  );
}

/* ── NUEVO: tabla resumen ARClim (presente vs ~2050, A vs B) ── */
function ArclimSummaryTable({serieA,serieB,zoneA,zoneB,indicador}){
  // Calcula promedio del período histórico (1980-2010) y futuro (2035-2065)
  const stat=(serie)=>{
    if(!serie||!serie.years||!serie.mean) return {hist:null,fut:null,delta:null,deltaPct:null};
    const years=serie.years; const mean=serie.mean;
    let sumH=0,nH=0,sumF=0,nF=0;
    for(let i=0;i<years.length;i++){
      const y=Number(years[i]); const v=Number(mean[i]);
      if(!isFinite(v)) continue;
      if(y>=1980&&y<=2010){ sumH+=v; nH++; }
      else if(y>=2035&&y<=2065){ sumF+=v; nF++; }
    }
    const hist=nH>0?sumH/nH:null;
    const fut =nF>0?sumF/nF:null;
    const delta=(hist!=null&&fut!=null)?fut-hist:null;
    const deltaPct=(hist!=null&&fut!=null&&hist!==0)?((fut-hist)/Math.abs(hist))*100:null;
    return {hist,fut,delta,deltaPct};
  };
  const sA=stat(serieA);
  const sB=stat(serieB);
  const unit=indicador?.unit||'';
  const fmt=(v)=>v==null?'—':v.toFixed(1);
  const fmtDelta=(v,pct)=>{
    if(v==null) return '—';
    const sign=v>0?'+':v<0?'−':'';
    return sign+Math.abs(v).toFixed(1)+(pct!=null?' ('+sign+Math.abs(pct).toFixed(0)+'%)':'');
  };
  const colorDelta=(v)=>{
    if(v==null) return 'var(--w55)';
    if(Math.abs(v)<0.05) return 'var(--w55)';
    return v>0?'#e07b5c':'#6dc6dd';
  };
  return(
    <div className="cz-arclim-summary">
      <div className="cz-table-head">
        <i className="fa-solid fa-table-list"/>Resumen tabular · presente (1980-2010) vs futuro (2035-2065)
      </div>
      <table className="cz-table cz-table--compact">
        <thead>
          <tr>
            <th>Zona</th>
            <th>Presente</th>
            <th>~2050</th>
            <th className="cz-th-delta">Δ ({unit})</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td className="cz-td-label"><span className="cz-zchip cz-zchip--a">A</span> {zoneA?.name||'—'}</td>
            <td className="cz-td-num">{fmt(sA.hist)} {unit}</td>
            <td className="cz-td-num">{fmt(sA.fut)} {unit}</td>
            <td className="cz-td-delta" style={{color:colorDelta(sA.delta)}}>{fmtDelta(sA.delta,sA.deltaPct)}</td>
          </tr>
          <tr>
            <td className="cz-td-label"><span className="cz-zchip cz-zchip--b">B</span> {zoneB?.name||'—'}</td>
            <td className="cz-td-num">{fmt(sB.hist)} {unit}</td>
            <td className="cz-td-num">{fmt(sB.fut)} {unit}</td>
            <td className="cz-td-delta" style={{color:colorDelta(sB.delta)}}>{fmtDelta(sB.delta,sB.deltaPct)}</td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

/* ══ SERIES ESTACIONALES — comparación interanual A vs B (Fase C) ══
   Las series se guardan en results con tipo_indice 'agua_serie_<IDX>_<EST>'
   o 'vegetacion_serie_<IDX>_<EST>'. Como la clave incluye índice y estación,
   emparejar por clave exacta garantiza que A y B sean comparables. */

const SERIE_ESTACION={DJF:'Verano',MAM:'Otoño',JJA:'Invierno',SON:'Primavera'};
const SERIE_MESES={DJF:'dic–feb',MAM:'mar–may',JJA:'jun–ago',SON:'sep–nov'};

/* Métricas disponibles según el tipo de serie. `get` extrae el valor de un período. */
const SERIE_METRICAS={
  agua:[
    {id:'water_ha', label:'Superficie', unit:'ha', dec:1, get:p=>p.water_ha},
    {id:'mean',     label:'Índice',     unit:'',   dec:3, get:p=>p.mean},
  ],
  vegetacion:[
    {id:'mean',     label:'Índice',     unit:'',   dec:3, get:p=>p.mean},
    {id:'clase_alta',label:'Clase alta',unit:'ha', dec:1, get:p=>{
      if(!p.classes_ha) return null;
      return p.classes_ha.c3!==undefined?p.classes_ha.c3:(p.classes_ha.densa!==undefined?p.classes_ha.densa:null);
    }},
  ],
};

function serieTipo(key){ return key.indexOf('vegetacion_')===0?'vegetacion':'agua'; }

/** Etiqueta legible de una clave de serie: 'agua_serie_MNDWI_DJF' → {…} */
function parseSerieKey(key){
  const parts=key.split('_');            // [tipo,'serie',INDICE,ESTACION]
  const tipo=serieTipo(key);
  const estacion=parts[parts.length-1];
  const indice=parts.slice(2,parts.length-1).join('_');
  return {
    tipo, indice, estacion,
    label:(tipo==='agua'?'Agua':'Vegetación')+' · '+indice,
    sub:(SERIE_ESTACION[estacion]||estacion)+' ('+(SERIE_MESES[estacion]||'')+')',
  };
}

/* Paleta por familia de clases (orden c0→c3, de menor a mayor valor del
   índice). Debe coincidir con VEG_CLASS_COLORS del Monitor. */
const CZ_SERIES_CLASS_COLORS={
  vigor:['#d9a679','#fee08b','#66bd63','#1a6b32'],
  humedad:['#8c510a','#dfc27d','#80cdc1','#01665e'],
  quemado:['#a50026','#f46d43','#a6d96a','#1a9850']
};
function czSeriesRgba(hex,alpha){
  const h=String(hex||'').replace('#','');
  if(h.length!==6) return hex;
  return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+','+alpha+')';
}
function czSeriesClasses(doc){
  const fam=doc&&doc.class_family||'vigor';
  const colors=CZ_SERIES_CLASS_COLORS[fam]||CZ_SERIES_CLASS_COLORS.vigor;
  const labels=doc&&doc.class_labels||['Muy bajo','Bajo','Medio','Alto'];
  const breaks=doc&&doc.class_breaks||[];
  const out=[];
  for(let i=0;i<4;i++){
    let range='';
    if(breaks.length===3){
      if(i===0) range=' (<'+breaks[0]+')';
      else if(i===3) range=' (>'+breaks[2]+')';
      else range=' ('+breaks[i-1]+'–'+breaks[i]+')';
    }
    out.push({key:'c'+i,label:(labels[i]||'Clase '+i)+range,color:colors[i]});
  }
  return out.reverse();
}
function czSeriesClassHa(period,key){
  if(!period||!period.classes_ha) return null;
  if(period.classes_ha[key]!==undefined) return period.classes_ha[key];
  const legacy={c0:'sin_veg',c1:'escasa',c2:'moderada',c3:'densa'};
  return legacy[key]&&period.classes_ha[legacy[key]]!==undefined?period.classes_ha[legacy[key]]:null;
}

/* ══ SERIES ESTACIONALES — una sección por módulo (Agua / Vegetación) ══
   Vive dentro del módulo temático que le corresponde, no en un módulo
   aparte: así el desplegable deja de mezclar agua con vegetación y el
   comparador mantiene el mismo modelo mental que el Monitor.
   Cada zona tiene su propio panel, lado a lado (igual que Severidad):
   superponer dos zonas con magnitudes distintas era ilegible. */
// Selector de año para el visor de imágenes (por panel).
function YearPick({side,years,value,onChange}){
  return(
    <label className="cz-imgyear">
      <span className={'cz-zchip cz-zchip--'+side}>{side.toUpperCase()}</span>
      <select value={value==null?'':value}
              onChange={e=>onChange(e.target.value===''?null:parseInt(e.target.value,10))}>
        <option value="">Año…</option>
        {years.slice().sort((a,b)=>a-b).map(y=><option key={y} value={y}>{y}</option>)}
      </select>
    </label>
  );
}

function SeriesSection({tipo,zoneA,zoneB,dataA,dataB,serieKey,setSerieKey}){
  const seriesA=useMemo(()=>{
    const o={},s=(dataA&&dataA._series)||{};
    Object.keys(s).forEach(k=>{if(parseSerieKey(k).tipo===tipo)o[k]=s[k];});
    return o;
  },[dataA,tipo]);
  const seriesB=useMemo(()=>{
    const o={},s=(dataB&&dataB._series)||{};
    Object.keys(s).forEach(k=>{if(parseSerieKey(k).tipo===tipo)o[k]=s[k];});
    return o;
  },[dataB,tipo]);

  // Combinaciones disponibles (estación × índice) con en qué zona existe cada una
  const combos=useMemo(()=>{
    const all=Array.from(new Set([...Object.keys(seriesA),...Object.keys(seriesB)]));
    return all.map(k=>{
      const i=parseSerieKey(k);
      return {key:k,estacion:i.estacion,indice:i.indice,enA:!!seriesA[k],enB:!!seriesB[k]};
    }).sort((x,y)=>{
      const bx=(x.enA&&x.enB)?0:1, by=(y.enA&&y.enB)?0:1;
      return bx-by||x.estacion.localeCompare(y.estacion)||x.indice.localeCompare(y.indice);
    });
  },[seriesA,seriesB]);

  const selKey=serieKey, setSelKey=setSerieKey;   // serie compartida (subida a la App)
  const[view,setView]=useState(null);
  const[escala,setEscala]=useState('compartida');
  const chipRef=useRef(null),segRef=useRef(null);

  useEffect(()=>{
    const ks=combos.map(c=>c.key);
    if(ks.length&&(!selKey||!ks.includes(selKey))) setSelKey(ks[0]);
    if(!ks.length&&selKey) setSelKey(null);
  },[combos]);

  const info=selKey?parseSerieKey(selKey):null;
  const docA=selKey?seriesA[selKey]:null, docB=selKey?seriesB[selKey]:null;

  // Estaciones disponibles, en orden natural del año
  const ORDEN=['DJF','MAM','JJA','SON'];
  const estaciones=useMemo(()=>{
    const set=Array.from(new Set(combos.map(c=>c.estacion)));
    return set.sort((a,b)=>ORDEN.indexOf(a)-ORDEN.indexOf(b));
  },[combos]);
  const estacionSel=info?info.estacion:null;
  // Índices disponibles dentro de la estación elegida
  const indices=useMemo(()=>combos.filter(c=>c.estacion===estacionSel),[combos,estacionSel]);

  const defaultView=tipo==='agua'?'superficie':'indice';
  useEffect(()=>{
    const validas=tipo==='agua'?['superficie','indice','anomalias']:['clases','indice','anomalias'];
    if(!view||!validas.includes(view)) setView(defaultView);
  },[selKey,tipo]);
  const activeView=view||defaultView;

  const classDefs=useMemo(()=>czSeriesClasses(docA||docB||{}),[docA,docB]);
  const years=useMemo(()=>{
    const s=new Set(); [docA,docB].forEach(d=>(d&&d.periods||[]).forEach(p=>s.add(p.year)));
    return Array.from(s).sort((a,b)=>a-b);
  },[docA,docB]);

  // Escala común entre paneles: preserva la comparación visual. Se puede
  // soltar cuando las zonas tienen magnitudes muy distintas.
  const yMax=useMemo(()=>{
    if(escala!=='compartida') return null;
    const vals=[];
    [docA,docB].forEach(d=>(d&&d.periods||[]).forEach(p=>{
      if(activeView==='superficie'&&p.water_ha!=null) vals.push(p.water_ha);
      else if(activeView==='clases'&&p.classes_ha) classDefs.forEach(c=>{
        const v=czSeriesClassHa(p,c.key); if(v!=null) vals.push(v);
      });
    }));
    return vals.length?Math.max(...vals)*1.12:null;
  },[docA,docB,activeView,escala,classDefs]);

  useEffect(()=>{
    if(!segRef.current||!chipRef.current) return;
    const b=segRef.current.querySelector('.cz-seg-btn.active');
    if(b){chipRef.current.style.left=b.offsetLeft+'px';chipRef.current.style.width=b.offsetWidth+'px';}
  },[activeView,selKey]);

  const viewOptions=tipo==='agua'
    ?[{id:'indice',label:'Índice'},{id:'superficie',label:'Superficie'},{id:'anomalias',label:'Anomalías'}]
    :[{id:'indice',label:'Índice'},
      {id:'clases',label:(docA||docB)?.class_family==='humedad'?'Humedad':(docA||docB)?.class_family==='quemado'?'Cobertura':'Vigor'},
      {id:'anomalias',label:'Anomalías'}];

  // Opciones para los dropdowns del panel, con disponibilidad A/B agregada
  const indicesInfo=useMemo(()=>{
    const m={};
    combos.forEach(c=>{ if(!m[c.indice]) m[c.indice]={indice:c.indice,enA:false,enB:false}; m[c.indice].enA=m[c.indice].enA||c.enA; m[c.indice].enB=m[c.indice].enB||c.enB; });
    return Object.values(m);
  },[combos]);
  const estacionesInfo=useMemo(()=>{
    const m={};
    combos.forEach(c=>{ if(!m[c.estacion]) m[c.estacion]={estacion:c.estacion,enA:false,enB:false}; m[c.estacion].enA=m[c.estacion].enA||c.enA; m[c.estacion].enB=m[c.estacion].enB||c.enB; });
    return ORDEN.filter(o=>m[o]).map(o=>m[o]);
  },[combos]);
  const _avail=o=>o.enA&&o.enB?'  ·  A·B':o.enA?'  ·  solo A':o.enB?'  ·  solo B':'';
  const _pickIndice=ind=>{ const c=combos.find(x=>x.indice===ind&&x.estacion===estacionSel)||combos.find(x=>x.indice===ind); if(c) setSelKey(c.key); };
  const _pickEstacion=es=>{ const c=(info&&combos.find(x=>x.estacion===es&&x.indice===info.indice))||combos.find(x=>x.estacion===es); if(c) setSelKey(c.key); };

  if(!combos.length) return null;   // sin series: la sección no aparece

  const avisos=[];
  if(selKey&&(!docA||!docB)){
    const falta=!docA?(zoneA?.name||'Zona A'):(zoneB?.name||'Zona B');
    avisos.push('Esta serie solo existe en una de las zonas. Falta calcularla en «'+falta+'» para poder comparar.');
  }
  if(docA&&docB&&docA.threshold!==undefined&&docB.threshold!==undefined&&docA.threshold!==docB.threshold)
    avisos.push('Las series se calcularon con umbrales distintos ('+docA.threshold+' vs '+docB.threshold+'): las superficies no son comparables.');
  if(docA&&docB&&docA.composite&&docB.composite&&docA.composite!==docB.composite)
    avisos.push('Las series usan composiciones distintas ('+docA.composite+' vs '+docB.composite+').');

  return(
    <div className="cz-series" style={{marginTop:14}}>
      <div className="cz-series-bar" style={{alignItems:'flex-start',flexDirection:'column',gap:10}}>
        <span className="cz-detail-eyebrow"><i className="fa-solid fa-chart-line"/>Serie estacional</span>

        {/* Panel ordenado: Índice · Estación · Vista como listas alineadas */}
        <div className="cz-serie-grid">
          <label className="cz-serie-lbl">Índice</label>
          <select className="cz-serie-sel" value={info?info.indice:''} onChange={e=>_pickIndice(e.target.value)}>
            {indicesInfo.map(o=><option key={o.indice} value={o.indice}>{o.indice+_avail(o)}</option>)}
          </select>

          <label className="cz-serie-lbl">Estación</label>
          <select className="cz-serie-sel" value={estacionSel||''} onChange={e=>_pickEstacion(e.target.value)}>
            {estacionesInfo.map(o=><option key={o.estacion} value={o.estacion}>{(SERIE_ESTACION[o.estacion]||o.estacion)+' · '+(SERIE_MESES[o.estacion]||'')+_avail(o)}</option>)}
          </select>

          <label className="cz-serie-lbl">Vista</label>
          <select className="cz-serie-sel" value={activeView} onChange={e=>setView(e.target.value)}>
            {viewOptions.map(o=><option key={o.id} value={o.id}>{o.label}</option>)}
          </select>
        </div>

        {(activeView==='superficie'||activeView==='clases')&&(
          <button className="cz-chip" style={{alignSelf:'flex-start'}}
                  onClick={()=>setEscala(e=>e==='compartida'?'propia':'compartida')}
                  title="Con escala compartida ambos paneles usan el mismo eje y son comparables a simple vista; con escala propia cada zona se ajusta a su magnitud.">
            <i className={'fa-solid '+(escala==='compartida'?'fa-link':'fa-link-slash')} style={{fontSize:10}}/>
            {escala==='compartida'?'Misma escala':'Escala propia'}
          </button>
        )}
      </div>

      {avisos.map((a,i)=>(
        <div key={i} className="cz-series-note"><i className="fa-solid fa-circle-info"/><span>{a}</span></div>
      ))}

      {activeView==='clases'&&classDefs.length>0&&(
        <div className="cz-dnbr-zone-legend" style={{paddingTop:0}}>
          {classDefs.map(c=>(
            <span className="cz-series-class-leg" key={c.key}>
              <span className="cz-series-class-dot" style={{background:c.color}}/>{c.label}
            </span>
          ))}
        </div>
      )}

      <div className="cz-series-zones">
        <SeriePanel side="a" zone={zoneA} doc={docA} view={activeView} years={years}
                    classDefs={classDefs} yMax={yMax} info={info} tipo={tipo}/>
        <SeriePanel side="b" zone={zoneB} doc={docB} view={activeView} years={years}
                    classDefs={classDefs} yMax={yMax} info={info} tipo={tipo}/>
      </div>
    </div>
  );
}

/* Panel de una zona: su propio gráfico + sus cifras de tendencia. */
function SeriePanel({side,zone,doc,view,years,classDefs,yMax,info,tipo}){
  const canvasRef=useRef(null), chartRef=useRef(null);
  const color=side==='a'?'#b99a6e':'#6aaa35';

  const valuesFor=(getter)=>{
    const byYear={}; (doc&&doc.periods||[]).forEach(p=>{byYear[p.year]=p;});
    return years.map(y=>{const p=byYear[y]; return p?getter(p):null;});
  };

  useEffect(()=>{
    if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}
    if(!canvasRef.current||!doc||!years.length||typeof Chart==='undefined') return;

    const datasets=[]; let chartType='bar'; let stacked=false; let yTitle='ha';

    if(view==='clases'){
      stacked=true;
      classDefs.forEach(c=>datasets.push({
        label:c.label, data:valuesFor(p=>czSeriesClassHa(p,c.key)),
        backgroundColor:c.color, borderWidth:0, borderRadius:2, borderSkipped:false,
      }));
    }else if(view==='superficie'){
      datasets.push({type:'bar',label:'Superficie',data:valuesFor(p=>p.water_ha),
        backgroundColor:valuesFor(p=>p.reliable?color:'rgba(140,155,165,.55)'),
        borderRadius:3,borderSkipped:false});
      if(doc.trend&&doc.trend.sen_slope_ha!==undefined)
        datasets.push({type:'line',label:'Tendencia',
          data:years.map(y=>doc.trend.sen_slope_ha*y+doc.trend.sen_intercept),
          borderColor:'#d98a3a',borderWidth:1.5,borderDash:[5,4],pointRadius:0,fill:false});
    }else if(view==='indice'){
      chartType='line'; yTitle='Índice';
      datasets.push({label:'p75',data:valuesFor(p=>p.p75),borderColor:'rgba(0,0,0,0)',pointRadius:0,fill:false,spanGaps:true,order:3});
      datasets.push({label:'p25–p75',data:valuesFor(p=>p.p25),borderColor:'rgba(0,0,0,0)',pointRadius:0,
        fill:'-1',backgroundColor:czSeriesRgba(color,.16),spanGaps:true,order:2});
      datasets.push({label:'Media '+((info&&info.indice)||''),data:valuesFor(p=>p.mean),
        borderColor:color,borderWidth:2,pointRadius:3,pointBackgroundColor:color,
        pointBorderColor:'#fff',pointBorderWidth:1,fill:false,spanGaps:true,order:1});
    }else{
      yTitle='';
      const vals=valuesFor(p=>p.mean).filter(v=>v!=null);
      const avg=vals.length?vals.reduce((a,v)=>a+v,0)/vals.length:0;
      const raw=valuesFor(p=>p.mean);
      datasets.push({type:'bar',label:'Anomalía',data:raw.map(v=>v==null?null:v-avg),
        backgroundColor:raw.map(v=>v==null?'rgba(0,0,0,0)':(v-avg>=0?'#2c7bb6':'#d98a3a')),
        borderRadius:3,borderSkipped:false});
    }

    chartRef.current=new Chart(canvasRef.current.getContext('2d'),{
      type:chartType,
      data:{labels:years,datasets},
      options:{
        responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{display:false},
          tooltip:{backgroundColor:'rgba(8,16,8,.94)',padding:9,cornerRadius:6,
            filter:it=>!String(it.dataset.label).startsWith('p75')&&!String(it.dataset.label).startsWith('p25'),
            callbacks:{
              label:it=>it.parsed.y==null?null:' '+it.dataset.label+': '+
                Number(it.parsed.y).toFixed(view==='indice'||view==='anomalias'?3:1)+(yTitle==='ha'?' ha':''),
              afterBody:items=>{
                if(!items.length) return null;
                const p=(doc.periods||[]).find(x=>x.year===years[items[0].dataIndex]);
                if(!p) return null;
                const out=['','Imágenes: '+p.n_images];
                if(p.coverage_pct!=null) out.push('Cobertura: '+Number(p.coverage_pct).toFixed(0)+'%');
                if(!p.reliable) out.push('⚠ Período poco confiable');
                return out;
              },
            }},
        },
        scales:{
          x:{stacked,ticks:{color:'rgba(29,43,29,.60)',font:{family:'DM Mono',size:10}},grid:{color:'rgba(31,61,28,.08)'}},
          y:{stacked,beginAtZero:view!=='indice',
             suggestedMax:(yMax&&(view==='superficie'||view==='clases'))?yMax:undefined,
             ticks:{color:'rgba(29,43,29,.60)',font:{family:'DM Mono',size:10}},
             grid:{color:'rgba(31,61,28,.08)'},
             title:{display:Boolean(yTitle),text:yTitle,color:'rgba(29,43,29,.48)',font:{family:'DM Mono',size:10}}},
        },
        animation:{duration:320},
      },
    });
    return()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}};
  },[doc,view,years,classDefs,yMax,color,info,tipo]);

  // Cifras: última medición, delta y tendencia
  const metricas=tipo?SERIE_METRICAS[tipo]||[]:[];
  const metricId=tipo==='agua'?(view==='superficie'?'water_ha':'mean'):(view==='clases'?'clase_alta':'mean');
  const metric=metricas.find(m=>m.id===metricId)||metricas[0]||null;

  let ultimo=null,delta=null,slope=null,sig=false,conf=null;
  if(doc&&metric){
    const vals=(doc.periods||[]).map(p=>metric.get(p)).filter(v=>v!=null);
    if(vals.length){ultimo=vals[vals.length-1]; if(vals.length>=2) delta=vals[vals.length-1]-vals[0];}
    const principal=tipo==='agua'?'water_ha':'mean';
    if(doc.trend&&metric.id===principal){
      slope=doc.trend.sen_slope!==undefined?doc.trend.sen_slope:doc.trend.sen_slope_ha;
      sig=!!doc.trend.significant;
    }
    conf=(doc.periods||[]).filter(p=>p.reliable).length+' / '+(doc.periods||[]).length;
  }
  const u=metric&&metric.unit?' '+metric.unit:'';

  return(
    <div className={'cz-serie-panel'+(side==='b'?' zb':'')}>
      <div className="cz-dnbr-zone-head">
        <span className={'cz-zchip cz-zchip--'+side}>{side.toUpperCase()}</span>
        <span className="cz-dnbr-zone-name">{zone?.name||'Sin zona'}</span>
        {doc&&slope!=null&&(
          <span className={'cz-series-card-tag'+(sig?' sig':'')}>{sig?'Significativa':'No signif.'}</span>
        )}
      </div>

      {doc
        ?<>
           <div className="cz-serie-panel-chart"><canvas ref={canvasRef}/></div>
           <div className="cz-series-rows">
             <div className="cz-series-row">
               <span className="cz-series-row-lbl">{metric?metric.label:'Valor'} · último año</span>
               <span className="cz-series-row-val">{ultimo!=null?ultimo.toFixed(metric.dec)+u:'—'}</span>
             </div>
             <div className="cz-series-row">
               <span className="cz-series-row-lbl">Δ del período</span>
               <span className={'cz-series-row-val'+(delta==null?'':(delta<0?' neg':(delta>0?' pos':'')))}>
                 {delta!=null?(delta>0?'+':'')+delta.toFixed(metric.dec)+u:'—'}
               </span>
             </div>
             <div className="cz-series-row">
               <span className="cz-series-row-lbl">Tendencia (Sen)</span>
               {slope!=null
                 ?<span className={'cz-series-row-val'+(slope<0?' neg':(slope>0?' pos':''))}>
                    {(slope>0?'+':'')+slope.toFixed(metric.dec===3?4:2)+u+'/año'}
                  </span>
                 :<span className="cz-series-row-val na">—</span>}
             </div>
             <div className="cz-series-row">
               <span className="cz-series-row-lbl">Períodos confiables</span>
               <span className="cz-series-row-val">{conf||'—'}</span>
             </div>
           </div>
         </>
        :<div className="cz-serie-panel-empty">Serie no calculada en esta zona</div>}
    </div>
  );
}

/* ══ SEVERIDAD dNBR — composición por clase, A vs B ══
   Redibuja aquí el mismo gráfico del Monitor a partir de figuras.clases.
   Barras agrupadas (no apiladas): lo que interesa es cuánta superficie
   cayó en cada clase en una zona frente a la otra. */
/* ══ MAP TILE (imperative Leaflet, managed with refs) ══ */
function DnbrZonePanel({side,zone,clases,fig,rows,modo,maxValue}){
  const canvasRef=useRef(null), chartRef=useRef(null);
  const unit=modo==='pct'?'%':'ha';
  const value=(r)=>{
    const cell=clases&&clases[r.idx];
    return cell&&cell[modo==='pct'?'pct':'ha']!=null?Number(cell[modo==='pct'?'pct':'ha']):null;
  };
  useEffect(()=>{
    if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}
    if(!canvasRef.current||!clases||!rows.length||typeof Chart==='undefined') return;
    chartRef.current=new Chart(canvasRef.current.getContext('2d'),{
      type:'bar',
      data:{labels:rows.map(r=>r.c.label),datasets:[{
        label:zone?.name||('Zona '+side.toUpperCase()), data:rows.map(value),
        backgroundColor:rows.map(r=>r.color), borderColor:'transparent', borderWidth:0,
        borderRadius:3, borderSkipped:false, barPercentage:.78, categoryPercentage:.78
      }]},
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(8,16,8,.94)',padding:9,cornerRadius:6,
          callbacks:{label:item=>item.parsed.x==null?null:' '+item.parsed.x.toFixed(1)+' '+unit,
            afterBody:items=>{const r=rows[items[0]?.dataIndex];return r?['','dNBR '+Number(r.c.min).toFixed(2)+' a '+Number(r.c.max).toFixed(2)]:null;}}}},
        scales:{
          x:{beginAtZero:true,suggestedMax:maxValue,ticks:{color:'rgba(29,43,29,.60)',font:{family:'DM Mono',size:10}},grid:{color:'rgba(31,61,28,.08)'},title:{display:true,text:unit,color:'rgba(29,43,29,.48)',font:{family:'DM Mono',size:10}}},
          y:{ticks:{color:'rgba(29,43,29,.68)',font:{family:'DM Sans',size:10}},grid:{display:false}}
        }, animation:{duration:320}
      }
    });
    return()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}};
  },[clases,rows,modo,maxValue,zone,side,unit]);
  const period=fig&&fig.periodos&&[fig.periodos.pre_inicio,fig.periodos.post_inicio].filter(Boolean).join(' · ');
  return(
    <section className={'cz-dnbr-zone-panel '+(side==='b'?'zb':'za')}>
      <div className="cz-dnbr-zone-head">
        <span className={'cz-zchip cz-zchip--'+side}>{side.toUpperCase()}</span>
        <span className="cz-dnbr-zone-name">{zone?.name||('Zona '+side.toUpperCase())}</span>
        {period&&<span className="cz-dnbr-zone-period">{period}</span>}
      </div>
      {!clases&&<div className="cz-dnbr-zone-empty"><i className="fa-solid fa-circle-info"/>Sin analisis dNBR</div>}
      {clases&&<>
        <div className="cz-dnbr-zone-legend">{rows.map(r=><span className="cz-series-class-leg" key={r.idx}><span className="cz-series-class-dot" style={{background:r.color}}/>{r.c.label}</span>)}</div>
        <div className="cz-dnbr-zone-chart"><canvas ref={canvasRef}/></div>
        <div className="cz-dnbr-zone-table"><table className="cz-table cz-table--compact"><thead><tr><th>Clase</th><th className="ht-num">Superficie</th><th className="ht-num">% del area</th></tr></thead><tbody>{rows.map(r=>{const cell=clases[r.idx];return <tr key={r.idx}><td className="cz-td-label"><span className="cz-dnbr-class-dot" style={{background:r.color}}/>{r.c.label}</td><td className="cz-td-num">{cell&&cell.ha!=null?Number(cell.ha).toFixed(1)+' ha':'—'}</td><td className="cz-td-num">{cell&&cell.pct!=null?Number(cell.pct).toFixed(1)+'%':'—'}</td></tr>;})}</tbody></table></div>
      </>}
    </section>
  );
}

function DnbrCompare({zoneA,zoneB,dataA,dataB}){
  const figA=dataA&&dataA.dnbr&&dataA.dnbr.figuras, figB=dataB&&dataB.dnbr&&dataB.dnbr.figuras;
  const clasesA=figA&&figA.clases, clasesB=figB&&figB.clases;
  const[modo,setModo]=useState('ha'),chipRef=useRef(null),segRef=useRef(null);
  const fallback=['#1a9850','#a6d96a','#dddddd','#ffffbf','#fdae61','#f46d43','#a50026'];
  const rows=useMemo(()=>{const src=clasesA||clasesB||[];return src.map((c,i)=>({c,idx:i,color:c.color||fallback[i%fallback.length]})).reverse();},[clasesA,clasesB]);
  const maxValue=useMemo(()=>{
    const vals=[...(clasesA||[]),...(clasesB||[])].map(c=>Number(c&&c[modo==='pct'?'pct':'ha'])||0);
    return Math.max(1,Math.max(...vals,0)*1.12);
  },[clasesA,clasesB,modo]);
  useEffect(()=>{if(!segRef.current||!chipRef.current)return;const b=segRef.current.querySelector('.cz-seg-btn.active');if(b){chipRef.current.style.left=b.offsetLeft+'px';chipRef.current.style.width=b.offsetWidth+'px';}},[modo,rows]);
  if(!clasesA&&!clasesB)return null;
  const avisos=[];
  if(!clasesA||!clasesB){const falta=!clasesA?(zoneA?.name||'Zona A'):(zoneB?.name||'Zona B');avisos.push('Solo una de las zonas tiene analisis de severidad. Calcula el dNBR en «'+falta+'» para comparar.');}
  const perA=figA&&figA.periodos,perB=figB&&figB.periodos;
  if(perA&&perB&&(perA.pre_inicio!==perB.pre_inicio||perA.post_inicio!==perB.post_inicio))avisos.push('Las zonas se analizaron con ventanas de fecha distintas. La severidad solo es comparable si ambas cubren el mismo evento.');
  return(
    <div className="cz-series cz-dnbr" style={{marginTop:14}}>
      <div className="cz-series-bar"><span className="cz-detail-eyebrow"><i className="fa-solid fa-fire"/>Severidad por clase</span><div className="cz-seg" ref={segRef}><span className="cz-seg-chip" ref={chipRef}/><button className={'cz-seg-btn'+(modo==='ha'?' active':'')} onClick={()=>setModo('ha')}>Hectareas</button><button className={'cz-seg-btn'+(modo==='pct'?' active':'')} onClick={()=>setModo('pct')}>% del area</button></div></div>
      {avisos.map((a,i)=><div key={i} className="cz-series-note"><i className="fa-solid fa-circle-info"/><span>{a}</span></div>)}
      <div className="cz-dnbr-zones">
        <DnbrZonePanel side="a" zone={zoneA} clases={clasesA} fig={figA} rows={rows} modo={modo} maxValue={maxValue}/>
        <DnbrZonePanel side="b" zone={zoneB} clases={clasesB} fig={figB} rows={rows} modo={modo} maxValue={maxValue}/>
      </div>
    </div>
  );
}

function MapTile({side,zone,mod,zoneData,syncGate,baseMapId,serieKey,year,setYear}){
  const elRef=useRef(null);
  const mapRef=useRef(null);
  const handlesRef=useRef({});
  const built=useRef(false);

  // init map once
  useEffect(()=>{
    if(!elRef.current||built.current) return;
    mapRef.current=CZMap.createBaseMap(elRef.current,zone,baseMapId);
    built.current=true;
    setTimeout(()=>{if(mapRef.current)mapRef.current.invalidateSize();},200);
    setTimeout(()=>{if(mapRef.current)mapRef.current.invalidateSize();},600);
    return()=>{
      if(mapRef.current){try{mapRef.current.remove();}catch(e){}}
      mapRef.current=null; built.current=false;
    };
  },[]);

  useEffect(()=>{
    if(mapRef.current) CZMap.setBaseMap(mapRef.current,baseMapId);
  },[baseMapId]);

  // expose map ref for sync
  useEffect(()=>{
    if(syncGate&&mapRef.current) syncGate.setMap(side,mapRef.current);
    return()=>{if(syncGate) syncGate.setMap(side,null);};
  },[syncGate]);

  // update zone + overlay when zone / mod / data changes
  useEffect(()=>{
    if(!mapRef.current||!built.current) return;
    const accent=side==='a'?'#C8A882':'#6AAA35';
    (async()=>{
      await CZMap.drawZone(mapRef.current,handlesRef.current,zone,mod,accent,0.82,zoneData);
      CZMap.fitZone(mapRef.current,zone,zoneData,mod&&mod.id);
      setTimeout(()=>{if(mapRef.current)mapRef.current.invalidateSize();},100);
    })();
  },[zone?.id,mod?.id,zoneData]);

  // ── Serie histórica: año a año del índice en este mapa ──
  const serieDoc=(mod&&(mod.id==='vegetacion'||mod.id==='agua')&&zoneData&&zoneData._series&&serieKey)
    ? zoneData._series[serieKey] : null;
  const availYears=useMemo(()=> serieDoc
    ? (serieDoc.periods||[]).filter(p=>p.indicePath).map(p=>p.year).sort((a,b)=>a-b)
    : [], [serieDoc]);
  // Al aparecer imágenes, arranca en el año más reciente; si no hay, limpia.
  useEffect(()=>{
    if(availYears.length){ if(year==null||!availYears.includes(year)) setYear(availYears[availYears.length-1]); }
    else if(year!=null) setYear(null);
  },[availYears]);
  // Dibuja el PNG del índice del año elegido (encima del ráster del módulo).
  useEffect(()=>{
    if(!mapRef.current||!built.current) return;
    let cancel=false;
    const h=handlesRef.current;
    if(h.yearOverlay){ try{mapRef.current.removeLayer(h.yearOverlay);}catch(e){} h.yearOverlay=null; }
    if(!serieDoc||year==null){ return; }
    const p=(serieDoc.periods||[]).find(x=>x.year===year);
    if(!p||!p.indicePath||!p.indiceBounds) return;
    (async()=>{
      const res=await supabase.storage.from('result-previews').createSignedUrl(p.indicePath,3600);
      if(cancel||!res.data||!res.data.signedUrl||!mapRef.current) return;
      const layer=L.imageOverlay(res.data.signedUrl,p.indiceBounds,{opacity:1,interactive:false,zIndex:450});
      layer.addTo(mapRef.current); handlesRef.current.yearOverlay=layer;
      try{ mapRef.current.fitBounds(p.indiceBounds,{padding:[16,16],animate:false}); }catch(e){}
    })();
    return()=>{cancel=true;};
  },[year,serieKey,serieDoc,zone?.id]);
  const _yi=availYears.indexOf(year);

  const hasMap=mod&&mod.type==='map';
  const hasData=zoneData&&mod&&zoneData[mod.id];

  return(
    <section className="cz-tile">
      <header className={'cz-tile-head cz-tile-head--'+side}>
        <span className={'cz-zchip cz-zchip--'+side}>{side.toUpperCase()}</span>
        <span className="cz-tile-name">{zone?zone.name:'Sin zona seleccionada'}</span>
        {zone&&hasMap&&availYears.length>0 ? (
          <span className="cz-yearstep" title="Año de la serie histórica">
            <button className="cz-yearstep-btn" aria-label="Año anterior" disabled={_yi<=0}
                    onClick={()=>{if(_yi>0) setYear(availYears[_yi-1]);}}><i className="fa-solid fa-chevron-left"/></button>
            <span className="cz-yearstep-val">{year||'—'}</span>
            <button className="cz-yearstep-btn" aria-label="Año siguiente" disabled={_yi>=availYears.length-1}
                    onClick={()=>{if(_yi<availYears.length-1) setYear(availYears[_yi+1]);}}><i className="fa-solid fa-chevron-right"/></button>
          </span>
        ) : (zone&&<span className="cz-tile-meta">{zone.area.toLocaleString('es-CL')} ha · {zone.date}</span>)}
      </header>
      <div className="cz-tile-body">
        {!zone&&(
          <div className="cz-tile-empty">
            <i className="fa-solid fa-map-marked-alt"/>
            Selecciona una zona
          </div>
        )}
        {zone&&hasMap&&!hasData&&(
          <div className="cz-tile-empty">
            <i className="fa-solid fa-image-slash"/>
            Sin imagen para este módulo
          </div>
        )}
        <div className="cz-map" ref={elRef} style={{display:zone?undefined:'none'}}/>
        {zone&&hasMap&&hasData&&<MapLegend mod={mod} data={zoneData[mod.id]}/>}
      </div>
    </section>
  );
}

/* ══ MAIN APP ══ */
function App({session,plan,zones}){
  const[zoneAId,setZoneAId]=useState(zones[0]?.id||null);
  const[zoneBId,setZoneBId]=useState(zones[1]?.id||null);
  const[modId,setModId]=useState('vegetacion');
  const[dataCache,setDataCache]=useState({});
  const[baseMapId,setBaseMapId]=useState('satelite');
  const syncMapsRef=useRef({a:null,b:null,unlink:null});
  // Serie histórica: serie elegida (índice+estación) compartida + año por panel
  const[serieKey,setSerieKey]=useState(null);
  const[yearA,setYearA]=useState(null);
  const[yearB,setYearB]=useState(null);

  const zoneA=useMemo(()=>zones.find(z=>z.id===zoneAId)||null,[zoneAId,zones]);
  const zoneB=useMemo(()=>zones.find(z=>z.id===zoneBId)||null,[zoneBId,zones]);
  const mod=useMemo(()=>CZ.MODULES.find(m=>m.id===modId),[modId]);
  const dataA=zoneAId?dataCache[zoneAId]?.data||null:null;
  const dataB=zoneBId?dataCache[zoneBId]?.data||null:null;

  // load zone results from Supabase
  const loadZoneData=useCallback(async(wsId)=>{
    if(!wsId||dataCache[wsId]) return;
    setDataCache(prev=>({...prev,[wsId]:{loading:true}}));
    try{
      // Pedir también updated_at para poder ordenar por más reciente
      const{data:rows}=await supabase.from('results')
        .select('tipo_indice,result_data,updated_at')
        .eq('workspace_id',wsId);
      const parsed={};
      // Cuando hay múltiples rows del mismo módulo (ej. vegetacion_NDVI y vegetacion_SAVI),
      // hay que quedarse con el MÁS RECIENTE (no con el último iterado de Supabase, que
      // no garantiza orden). De lo contrario el comparador podía mostrar datos viejos
      // bugueados aunque ya existiera un análisis nuevo.
      (rows||[]).forEach(row=>{
        // Capa complementaria de streams (Hidromorfología): no es un módulo,
        // se guarda junto a la cuenca para poder verla aquí como capa aparte.
        if(row.tipo_indice==='hidromorfologia_streams' && row.result_data){
          const sd = Array.isArray(row.result_data) ? row.result_data[0] : row.result_data;
          if(sd && sd.streams) parsed._streams = sd;
          return;
        }
        // Series estacionales (ej. 'agua_serie_MNDWI_DJF'): result_data es un
        // doc de serie, no mediciones con preview. Van a _series y las consume
        // el módulo Series; nunca deben pisar los módulos de mapa.
        if(row.tipo_indice&&row.tipo_indice.indexOf('_serie')>-1){
          const sd = Array.isArray(row.result_data) ? row.result_data[0] : row.result_data;
          if(sd && sd.periods && sd.periods.length){
            if(!parsed._series) parsed._series = {};
            parsed._series[row.tipo_indice] = sd;
          }
          return;
        }
        const modDef=CZ.MODULES.find(m=>row.tipo_indice&&m.prefix&&row.tipo_indice.startsWith(m.prefix));
        if(!modDef||!row.result_data||!row.result_data.length) return;
        const item=row.result_data.reduce((a,b)=>((a.ts||0)>(b.ts||0)?a:b));
        const ts = item.ts || (row.updated_at ? Date.parse(row.updated_at) : 0);
        // Si ya hay uno para este módulo, conservar el más reciente
        const prev = parsed[modDef.id];
        if(prev && (prev._ts||0) >= ts) return;
        const indiceUsado = item.indice
          || (row.tipo_indice.split('_').slice(1).join('_'))
          || null;
        parsed[modDef.id]={
          ...(item.stats||{}),
          previewPath:item.previewPath,
          previewBounds:item.previewBounds,
          // Datos para redibujar los gráficos del análisis (composición de
          // severidad, distribuciones de biodiversidad, etc.). Se guardan
          // como datos y no como imagen: es lo único que permite superponer
          // dos zonas y conservar los tooltips.
          figuras: item.figuras || null,
          // Biodiversidad guarda sus cuatro distribuciones dentro de
          // `figuras`; las exponemos al mismo nivel que las estadísticas para
          // que el comparador pueda reconstruir sus gráficos.
          ...(modDef.id==='biodiversidad' && item.figuras ? item.figuras : {}),
          indice: indiceUsado,
          ts: item.ts || null,
          _ts: ts,                     // interno: para tie-breaking entre rows
          updated_at: row.updated_at,  // para mostrar "calculado el ..."
        };
      });
      setDataCache(prev=>({...prev,[wsId]:{loading:false,data:parsed}}));
    }catch(e){
      console.error('loadZoneData',e);
      setDataCache(prev=>({...prev,[wsId]:{loading:false,data:{}}}));
    }
  },[dataCache]);

  useEffect(()=>{if(zoneAId) loadZoneData(zoneAId);},[zoneAId]);
  useEffect(()=>{if(zoneBId) loadZoneData(zoneBId);},[zoneBId]);

  // map sync gate — default OFF (cada mapa se mueve independiente).
  // Se puede activar con el toggle "Sincronizar mapas" en la topbar.
  const [syncOn,setSyncOn]=useState(false);
  const syncGate=useMemo(()=>({
    enabled:false,  // se sobrescribe abajo con useEffect
    getMap:(side)=>syncMapsRef.current[side],
    setMap:(side,map)=>{
      syncMapsRef.current[side]=map;
      if(syncMapsRef.current.unlink){syncMapsRef.current.unlink();syncMapsRef.current.unlink=null;}
      if(syncMapsRef.current.a&&syncMapsRef.current.b){
        syncMapsRef.current.unlink=CZMap.linkSync(syncMapsRef.current.a,syncMapsRef.current.b,syncGate);
      }
    }
  }),[]);
  // Sincronizar estado React con el gate (sin re-crear los listeners)
  useEffect(()=>{ syncGate.enabled=syncOn; },[syncOn,syncGate]);

  const isMapMode=mod&&mod.type==='map';
  const isBio=mod&&mod.type==='bio';
  const isArclim=mod&&mod.type==='arclim';

  const goReanalyze=useCallback(()=>{window.open('acceso-datos.html','_self');},[]);

  return(
    <div className="cz-root">
      {/* TOPBAR */}
      <header className="cz-topbar">
        <a className="cz-back" href="acceso-datos.html">
          <i className="fa-solid fa-arrow-left"/>
          <img src="img/logo3.png" alt="Monitor Pro" className="cz-logo"/>
        </a>
        <div className="cz-title">
          <span className="cz-title-main">MONITOR PRO</span>
          <span className="cz-title-eyebrow">Módulo Comparativo</span>
        </div>
        <div className="cz-topbar-right">
          {isMapMode&&(
            <label className="cz-sync-toggle" title="Sincroniza pan/zoom entre ambos mapas">
              <input type="checkbox" checked={syncOn} onChange={e=>setSyncOn(e.target.checked)}/>
              <span className="cz-sync-track"><span className="cz-sync-dot"/></span>
              <span className="cz-sync-label">Sincronizar mapas</span>
            </label>
          )}
          <span className="cz-plan-tag">{plan}</span>
        </div>
      </header>

      {/* BODY */}
      <div className="cz-body">
        {/* SIDEBAR */}
        <aside className="cz-sidebar">
          <div className="cz-side-group">
            <div className="cz-side-label">Zona A</div>
            <ZoneSelect side="a" zone={zoneA} otherId={zoneBId} onPick={setZoneAId} zones={zones}/>
          </div>
          <div className="cz-side-group">
            <div className="cz-side-label">Zona B</div>
            <ZoneSelect side="b" zone={zoneB} otherId={zoneAId} onPick={setZoneBId} zones={zones}/>
          </div>
          <div className="cz-side-divider"/>
          <nav className="cz-modrail">
            <div className="cz-side-label">Módulo de análisis</div>
            {CZ.MODULES.map(m=>(
              <button key={m.id} className={'cz-modtab'+(m.id===modId?' active':'')} onClick={()=>setModId(m.id)}>
                <span className="cz-modtab-radio"/>
                <i className={'fa-solid '+m.icon}/>
                <span>{m.label}</span>
                {m.type!=='map'&&<span className="cz-tab-dot" title="Datos no-raster"/>}
              </button>
            ))}
          </nav>
        </aside>

        {/* CANVAS */}
        <main className="cz-canvas">
          {/* Overview: ficha técnica morfológica + mini-mapa de forma (reemplaza la tira de KPIs) */}
          <ZonesOverview zoneA={zoneA} zoneB={zoneB} baseMapId={baseMapId} onBaseMapChange={setBaseMapId}/>

          {/* Stage */}
          <div className="cz-stage">
            {isMapMode&&(
              <div className="cz-tiles">
                <MapTile side="a" zone={zoneA} mod={mod} zoneData={dataA} syncGate={syncGate} baseMapId={baseMapId} serieKey={serieKey} year={yearA} setYear={setYearA}/>
                <MapTile side="b" zone={zoneB} mod={mod} zoneData={dataB} syncGate={syncGate} baseMapId={baseMapId} serieKey={serieKey} year={yearB} setYear={setYearB}/>
              </div>
            )}

            <div className="cz-detail">
              {isArclim
                ?<ArclimDashboard mod={mod} zoneA={zoneA} zoneB={zoneB}/>
                :isBio
                  ?<BioCompare mod={mod} zoneA={zoneA} zoneB={zoneB} dataA={dataA} dataB={dataB} onReanalyze={goReanalyze}/>
                  :(
                    <>
                      <div className="cz-detail-head">
                        <span className="cz-detail-eyebrow">
                          <i className={'fa-solid '+mod.icon}/>{mod.label}{mod.index?' · '+mod.index:''}
                        </span>
                        <span className="cz-detail-note">Δ = Zona B − Zona A</span>
                      </div>
                      <MetricsCompareSection mod={mod} dataA={dataA} dataB={dataB} zoneA={zoneA} zoneB={zoneB}/>
                      {mod.id==='vegetacion'&&<PisoStrip dataA={dataA} dataB={dataB}/>}
                      {mod.id==='dnbr'&&<DnbrCompare zoneA={zoneA} zoneB={zoneB} dataA={dataA} dataB={dataB}/>}
                      {/* La serie estacional vive dentro de su módulo temático */}
                      {(mod.id==='vegetacion'||mod.id==='agua')&&(
                        <SeriesSection tipo={mod.id} zoneA={zoneA} zoneB={zoneB} dataA={dataA} dataB={dataB} serieKey={serieKey} setSerieKey={setSerieKey}/>
                      )}
                    </>
                  )
              }
            </div>
          </div>
        </main>
      </div>
    </div>
  );
}

function UpgradeWall(){
  return(
    <div className="cz-upgrade">
      <div className="cz-upgrade-card">
        <div className="cz-upgrade-icon"><i className="fa-solid fa-layer-group"/></div>
        <div className="cz-upgrade-title">Disponible en Plan Pro</div>
        <div className="cz-upgrade-text">
          El Módulo Comparativo requiere plan <strong>Pro</strong> o <strong>Enterprise</strong> para acceder a múltiples zonas de estudio.
        </div>
        <a href="acceso-datos.html" className="cz-upgrade-btn">
          <i className="fa-solid fa-arrow-left"/> Volver al Workspace
        </a>
      </div>
    </div>
  );
}

function Loading({msg}){
  return(
    <div className="cz-boot">
      <div className="cz-boot-spin"/>
      {msg||'Cargando…'}
    </div>
  );
}

/* ══ Bootstrap ══ */
const rootEl=ReactDOM.createRoot(document.getElementById('root'));

async function bootstrap(){
  rootEl.render(<Loading msg="Iniciando sesión…"/>);
  document.body.style.visibility='visible';

  const{data:{session}}=await supabase.auth.getSession();
  if(!session){window.location.href='login.html';return;}

  rootEl.render(<Loading msg="Verificando acceso…"/>);
  const{data:quota}=await supabase.from('user_quotas').select('plan,is_active').eq('user_id',session.user.id).single();
  const plan=(quota&&quota.plan)||'free';

  if(plan==='free'){rootEl.render(<UpgradeWall/>);return;}

  rootEl.render(<Loading msg="Cargando zonas de estudio…"/>);
  // FIX: cargar TODAS las zonas del usuario con polígono, no solo la activa.
  // El constraint UNIQUE idx_workspaces_one_active_per_user permite solo
  // 1 zona is_active=true por user_id; filtrar por is_active bloqueaba la comparación.
  const{data:wsList}=await supabase.from('workspaces').select('id,zone_name,zona_ha,created_at,polygon_geojson,is_active').eq('user_id',session.user.id).not('polygon_geojson','is',null).order('created_at',{ascending:false});

  CZ.ZONES=(wsList||[]).map(CZ.wsToZone);
  rootEl.render(<App session={session} plan={plan} zones={CZ.ZONES}/>);
}

bootstrap().catch(err=>{
  console.error(err);
  rootEl.render(<div style={{color:'var(--neg)',padding:'40px',fontFamily:'var(--mono)',fontSize:'12px'}}>Error: {String(err)}</div>);
});
</script>
</body>
</html>
