<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo Comparativo — Monitor Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #eef3ec; --bg2: #f7faf5; --panel: #ffffff; --mapbg: #e8ede8;
  --border: rgba(31,61,28,0.12); --border2: rgba(31,61,28,0.07);
  --card: rgba(31,61,28,0.045);
  --white: #1d2b1d; --w90: rgba(29,43,29,0.90); --w70: rgba(29,43,29,0.68);
  --w55: rgba(29,43,29,0.52); --w40: rgba(29,43,29,0.38); --w25: rgba(29,43,29,0.22);
  --accent: #4d8a1f; --data: #6aaa35; --neg: #b84a46;
  --za: #b99a6e; --zb: #6aaa35;
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
  --mono: 'DM Mono', monospace;

  /* ── Material / vibrancy (lenguaje iOS-macOS) ──
     Superficies translúcidas que dejan pasar el fondo desenfocado,
     hairlines de 0.5px y sombras suaves en vez de bordes duros. */
  --mat-1: rgba(255,255,255,0.86);   /* card base            */
  --mat-2: rgba(255,255,255,0.98);   /* card elevada / hover */
  --mat-chrome: rgba(250,252,248,0.92);   /* topbar / sidebar     */
  --hairline: rgba(31,61,28,0.13);
  --hairline-soft: rgba(31,61,28,0.08);
  --blur: saturate(180%) blur(28px);
  --blur-sm: saturate(160%) blur(14px);
  --shadow-1: 0 1px 2px rgba(0,0,0,.28), 0 4px 16px rgba(0,0,0,.24);
  --shadow-2: 0 2px 6px rgba(0,0,0,.32), 0 16px 44px rgba(0,0,0,.40);
  /* Escala de radios: contenedor > interior > control */
  --r-lg: 18px; --r-md: 14px; --r-sm: 10px; --r-xs: 8px;
  --ease: cubic-bezier(.32,.72,0,1);   /* curva tipo spring de iOS */
}
html, body { height: 100%; }
body {
  color: var(--white); font-family: var(--sans); font-weight: 300; overflow: hidden;
  /* Fondo en capas: da profundidad para que el blur de las superficies
     tenga algo que muestrear (si es plano, la vibrancy no se percibe). */
  background:
    radial-gradient(1100px 620px at 12% -8%,  rgba(166,207,147,0.24), transparent 60%),
    radial-gradient(900px 520px at 88% 4%,   rgba(226,214,190,0.28), transparent 62%),
    radial-gradient(1000px 700px at 50% 108%, rgba(193,218,180,0.16), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
#root { height: 100vh; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(31,61,28,0.18); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(31,61,28,0.30); background-clip: content-box; }

/* ── Segmented control (iOS) ──
   Contenedor pill translúcido + chip deslizante para la opción activa. */
.cz-seg {
  display: inline-flex; position: relative; padding: 2px; gap: 2px;
  background: rgba(255,255,255,0.07); border: 0.5px solid var(--hairline-soft);
  border-radius: 999px;
}
.cz-seg-btn {
  position: relative; z-index: 1; padding: 5px 13px; border-radius: 999px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--w55); transition: color .22s var(--ease); white-space: nowrap;
}
.cz-seg-btn:hover { color: var(--w90); }
.cz-seg-btn.active { color: var(--bg); font-weight: 500; }
.cz-seg-chip {
  position: absolute; top: 2px; bottom: 2px; z-index: 0; border-radius: 999px;
  background: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.3);
  transition: left .32s var(--ease), width .32s var(--ease);
}

.cz-root { display: flex; flex-direction: column; height: 100vh; }

/* ── TOPBAR ── */
/* Mismo chrome que la topbar de acceso-datos (--topbar-bg #192f0b, 48px)
   para que el usuario no perciba un cambio de aplicación al entrar aquí. */
.cz-topbar {
  height: 48px; flex-shrink: 0; display: flex; align-items: center;
  justify-content: space-between; padding: 0 16px 0 12px;
  background: #192f0b;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  position: relative; z-index: 60;
}
.cz-topbar .cz-back { color: rgba(255,255,255,0.7); }
.cz-topbar .cz-back:hover { color: #fff; }
.cz-topbar .cz-logo { height: 22px; }
.cz-topbar .cz-title-main { color: rgba(255,255,255,0.92); font-size: 13px; }
.cz-topbar .cz-title-eyebrow { color: #8ec63f; }
.cz-topbar .cz-plan-tag {
  color: rgba(255,255,255,0.75);
  border-color: rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06);
}
.cz-topbar .cz-sync-toggle { color: rgba(255,255,255,0.7); }
.cz-topbar .cz-sync-track { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.18); }
.cz-topbar .cz-sync-dot { background: rgba(255,255,255,0.55); }
.cz-topbar .cz-sync-toggle input:checked + .cz-sync-track {
  background: rgba(106,170,53,0.35); border-color: rgba(106,170,53,0.6);
}
.cz-topbar .cz-sync-toggle input:checked + .cz-sync-track .cz-sync-dot { background: #8ec63f; }
.cz-back { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--w55); transition: color .2s; }
.cz-back:hover { color: var(--white); }
.cz-back i { font-size: 13px; }
.cz-logo { height: 26px; width: auto; opacity: .92; }
.cz-title { text-align: center; display: flex; flex-direction: column; gap: 3px; line-height: 1.15; }
.cz-title-main { font-family: var(--mono); font-size: 14px; letter-spacing: .26em; text-transform: uppercase; color: var(--white); font-weight: 500; }
.cz-title-eyebrow { font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.cz-topbar-right { display: flex; align-items: center; gap: 14px; }
.cz-plan-tag { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--w40); border: 1px solid var(--border); border-radius: 5px; padding: 4px 9px; }

/* Toggle sincronizar mapas */
.cz-sync-toggle {
  display: inline-flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--w70);
}
.cz-sync-toggle input { display: none; }
.cz-sync-track {
  position: relative; width: 30px; height: 16px;
  border-radius: 999px; background: rgba(244,247,241,0.08);
  border: 1px solid var(--border); transition: background .2s, border-color .2s;
  flex-shrink: 0;
}
.cz-sync-dot {
  position: absolute; top: 1px; left: 1px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--w40); transition: transform .2s, background .2s;
}
.cz-sync-toggle input:checked + .cz-sync-track {
  background: rgba(106,170,53,0.22);
  border-color: rgba(106,170,53,0.45);
}
.cz-sync-toggle input:checked + .cz-sync-track .cz-sync-dot {
  transform: translateX(14px);
  background: var(--accent);
}
.cz-sync-toggle:hover .cz-sync-track { border-color: var(--w40); }
.cz-sync-label { white-space: nowrap; }
.cz-export {
  display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500;
  color: var(--bg); background: var(--accent); padding: 7px 14px; border-radius: 7px; transition: filter .2s; cursor: pointer;
}
.cz-export:hover { filter: brightness(1.08); }

/* ── BODY ── */
.cz-body { flex: 1; min-height: 0; display: flex; }

/* ── SIDEBAR ── */
.cz-sidebar {
  width: 244px; flex-shrink: 0;
  background: var(--mat-chrome);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border-right: 0.5px solid var(--hairline);
  display: flex; flex-direction: column; gap: 16px; padding: 18px 14px; overflow-y: auto;
}
.cz-side-group { display: flex; flex-direction: column; gap: 5px; }
.cz-side-label { font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--w40); }
.cz-side-divider { height: 1px; background: var(--border); margin: 2px 0; }

/* zone selector */
.cz-zsel { position: relative; width: 100%; }
.cz-zsel-btn {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left;
  background: var(--mat-1); border: 0.5px solid var(--hairline); border-left-width: 3px;
  border-radius: var(--r-sm); box-shadow: var(--shadow-1);
  padding: 8px 10px; transition: border-color .2s var(--ease), background .2s var(--ease); cursor: pointer;
}
.cz-zsel--a .cz-zsel-btn { border-left-color: var(--za); }
.cz-zsel--b .cz-zsel-btn { border-left-color: var(--zb); }
.cz-zsel-btn:hover, .cz-zsel-btn.open { background: rgba(31,61,28,0.045); }
.cz-zsel-name { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.cz-zsel-title { font-size: 12px; font-weight: 500; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cz-zsel-meta { font-family: var(--mono); font-size: 8.5px; letter-spacing: .04em; color: var(--w40); text-transform: uppercase; }
.cz-zsel-caret { font-size: 10px; color: var(--w40); transition: transform .2s; flex-shrink: 0; }
.cz-zsel-btn.open .cz-zsel-caret { transform: rotate(180deg); }
.cz-zsel-menu {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 1200;
  background: var(--panel); color: var(--white);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 0.5px solid var(--hairline); border-radius: var(--r-md);
  padding: 6px; box-shadow: var(--shadow-2); max-height: 280px; overflow-y: auto;
}
.cz-zsel-item {
  width: 100%; display: flex; flex-direction: column; gap: 2px; text-align: left;
  padding: 9px 11px; border-radius: 8px; transition: background .15s; cursor: pointer;
}
.cz-zsel-item:hover { background: rgba(31,61,28,0.06); }
.cz-zsel-item.sel { background: rgba(200,168,130,0.10); }
.cz-zsel-item-title { font-size: 13px; font-weight: 500; color: var(--white); display: flex; align-items: center; gap: 8px; }
.cz-zsel-dup { font-family: var(--mono); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; color: var(--w40); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
.cz-zsel-item-meta { font-family: var(--mono); font-size: 9px; color: var(--w40); text-transform: uppercase; }
.cz-zchip {
  width: 19px; height: 19px; flex-shrink: 0; border-radius: 5px;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10px; font-weight: 500; border: 1px solid;
}
.cz-zchip--a { color: var(--za); border-color: color-mix(in srgb, var(--za) 50%, transparent); background: color-mix(in srgb, var(--za) 12%, transparent); }
.cz-zchip--b { color: var(--zb); border-color: color-mix(in srgb, var(--zb) 50%, transparent); background: color-mix(in srgb, var(--zb) 12%, transparent); }

/* module rail */
/* Rail de módulos — filas tipo sidebar de macOS (Finder/Mail):
   sin radio button, selección como píldora rellena. */
.cz-modrail { display: flex; flex-direction: column; gap: 1px; }
.cz-modtab {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: var(--r-xs); color: var(--w70); font-size: 13px; font-weight: 400;
  transition: background .2s var(--ease), color .2s var(--ease);
}
.cz-modtab-radio { display: none; }
.cz-modtab i { font-size: 12px; width: 20px; text-align: center; color: var(--w40); transition: color .2s var(--ease); }
.cz-modtab:hover { background: rgba(31,61,28,0.05); color: var(--white); }
.cz-modtab:hover i { color: var(--w70); }
.cz-modtab.active {
  background: linear-gradient(180deg, rgba(200,168,130,0.30), rgba(200,168,130,0.20));
  color: var(--white); font-weight: 500;
  box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.48), 0 1px 3px rgba(31,61,28,.12);
}
.cz-modtab.active i { color: var(--accent); }
.cz-tab-dot { margin-left: auto; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: .7; }
.cz-modtab.active .cz-tab-dot { background: rgba(255,255,255,.75); }

/* ── CANVAS ── */
.cz-canvas {
  flex: 1; min-width: 0; min-height: 0;
  display: flex; flex-direction: column; gap: 16px;
  padding: 18px 20px 22px; overflow-y: auto; background: transparent;
}

/* KPI row */
.cz-kpis { flex-shrink: 0; display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }

/* Overview = ficha técnica morfológica + mini-mapa de forma (compacto) */
/* Fila de contexto: altura FIJA. Al ser un grid con align-items:stretch,
   basta que una tarjeta crezca (p. ej. el mini-mapa con un polígono
   alargado) para que las tres se estiren y dejen medio panel vacío.
   Con la fila fijada, la primera franja siempre ocupa lo mismo y lo que
   no quepa hace scroll dentro de su tarjeta. */
.cz-overview {
  flex-shrink: 0;
  display: grid; grid-template-columns: minmax(0,1.35fr) minmax(220px,.85fr) minmax(220px,.78fr);
  grid-auto-rows: 196px;
  gap: 12px;
}
.cz-tech-sheet, .cz-shape-mini {
  background: var(--mat-1); border: 0.5px solid var(--hairline);
  -webkit-backdrop-filter: var(--blur-sm); backdrop-filter: var(--blur-sm);
  box-shadow: var(--shadow-1);
  border-radius: var(--r-md); padding: 12px 14px 10px;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.cz-tech-sheet { overflow-y: auto; }
.cz-tech-sheet .cz-table-head,
.cz-shape-mini .cz-table-head {
  padding: 0 2px 8px; margin-bottom: 0; font-size: 10px;
}
.cz-tech-sheet .cz-table--compact th { padding: 4px 8px; font-size: 8.5px; }
.cz-tech-sheet .cz-table--compact td { padding: 4px 8px; font-size: 11px; }
.cz-tech-sheet .cz-table--compact .cz-td-num { font-size: 11.5px; }
.cz-tech-sheet .cz-table--compact .cz-td-delta { font-size: 10px; }

/* Selector compartido para ambos mapas. */
.cz-basemap-card {
  background: var(--mat-1); border: 0.5px solid var(--hairline);
  -webkit-backdrop-filter: var(--blur-sm); backdrop-filter: var(--blur-sm);
  box-shadow: var(--shadow-1); border-radius: var(--r-md); padding: 12px 14px 11px;
  min-height: 0; overflow: hidden;
}
.cz-basemap-options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cz-basemap-option {
  display: flex; align-items: center; gap: 7px; min-width: 0;
  padding: 7px 8px; border: 1px solid var(--border); border-radius: var(--r-xs);
  color: var(--w55); background: rgba(31,61,28,0.025); font-size: 11px; text-align: left;
  transition: background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);
}
.cz-basemap-option i { width: 14px; text-align: center; color: var(--w40); }
.cz-basemap-option:hover { background: rgba(106,170,53,0.08); color: var(--w90); border-color: rgba(106,170,53,.28); }
.cz-basemap-option.active { background: rgba(106,170,53,0.14); border-color: rgba(106,170,53,.45); color: #315c1b; font-weight: 500; }
.cz-basemap-option.active i { color: var(--accent); }
.cz-basemap-sync { display: flex; align-items: center; gap: 7px; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--border); color: var(--w55); font-size: 10px; }
.cz-basemap-sync input { accent-color: var(--accent); }

/* Mini-mapa schematic de diferencia de polígonos */
.cz-shape-mini-canvas {
  position: relative; flex: 1; min-height: 0;
}
.cz-shape-mini-canvas canvas {
  width: 100% !important; height: 100% !important;
  display: block;
}

@media (max-width: 1100px) {
  .cz-overview { grid-template-columns: 1.2fr .8fr; grid-auto-rows: 186px; }
  .cz-basemap-card { grid-column: 1 / -1; }
}
.cz-kpi {
  background: var(--mat-1); border: 0.5px solid var(--hairline);
  -webkit-backdrop-filter: var(--blur-sm); backdrop-filter: var(--blur-sm);
  box-shadow: var(--shadow-1);
  border-radius: var(--r-md); padding: 15px 17px; display: flex; flex-direction: column; gap: 11px;
}
.cz-kpi-head { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--w55); display: flex; align-items: center; gap: 8px; }
.cz-kpi-head i { color: var(--accent); font-size: 12px; }
.cz-kpi-flow { display: flex; align-items: baseline; gap: 10px; }
.cz-kpi-num { font-family: var(--mono); font-weight: 400; letter-spacing: -.02em; font-size: 27px; }
.cz-kpi-num--a { color: var(--w70); }
.cz-kpi-num--b { color: var(--white); }
.cz-kpi-arrow { font-size: 13px; color: var(--w40); align-self: center; }
.cz-kpi-delta {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 12.5px; border: 1px solid; border-radius: 50px; padding: 3px 11px;
}
.cz-kpi-delta-tag { font-size: 8.5px; letter-spacing: .1em; color: var(--w40); border-left: 1px solid var(--border); padding-left: 7px; margin-left: 1px; }

/* stage */
.cz-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }

/* map tiles */
.cz-tiles { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: 50vh; min-height: 320px; }
.cz-tile {
  display: flex; flex-direction: column;
  background: var(--mat-1); border: 0.5px solid var(--hairline);
  -webkit-backdrop-filter: var(--blur-sm); backdrop-filter: var(--blur-sm);
  box-shadow: var(--shadow-2);
  border-radius: var(--r-lg); overflow: hidden;
}
.cz-tile-head { display: flex; align-items: center; gap: 9px; padding: 11px 15px; border-bottom: 0.5px solid var(--hairline); border-left: 3px solid transparent; }
.cz-tile-head--a { border-left-color: var(--za); }
.cz-tile-head--b { border-left-color: var(--zb); }
.cz-tile-name { font-family: var(--serif); font-size: 14px; font-weight: 500; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cz-tile-meta { font-family: var(--mono); font-size: 9px; letter-spacing: .04em; text-transform: uppercase; color: var(--w40); margin-left: auto; white-space: nowrap; }
.cz-tile-body { flex: 1; position: relative; min-height: 0; background: var(--mapbg); }
.cz-map { position: absolute; inset: 0; background: var(--mapbg); }
.cz-tile-empty {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 9px; color: var(--w40); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
}
.cz-tile-empty i { font-size: 22px; opacity: .35; }

/* legend */
.cz-legend {
  position: absolute; bottom: 9px; left: 9px; z-index: 650; width: 142px;
  background: rgba(250,252,248,0.88); color: var(--white); backdrop-filter: blur(12px);
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 8px;
}
.cz-legend-title { font-family: var(--mono); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: var(--w55); margin-bottom: 5px; }
.cz-legend-bar { height: 6px; border-radius: 3px; }
.cz-legend-scale { display: flex; justify-content: space-between; margin-top: 4px; font-family: var(--mono); font-size: 8px; color: var(--w40); }

/* detail */
.cz-detail {
  flex: 0 0 auto;
  background: var(--mat-1); border: 0.5px solid var(--hairline);
  -webkit-backdrop-filter: var(--blur-sm); backdrop-filter: var(--blur-sm);
  box-shadow: var(--shadow-1);
  border-radius: var(--r-lg); padding: 16px 18px 18px;
}
.cz-detail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cz-detail-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: inline-flex; align-items: center; gap: 8px; }
.cz-detail-note { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; color: var(--w40); text-transform: uppercase; }

/* metric cards */
.cz-metrics-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
.cz-metric { background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 16px 17px; }
.cz-metric-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--w55); margin-bottom: 11px; }
.cz-metric-vals { display: flex; flex-direction: column; gap: 5px; margin-bottom: 11px; }
.cz-metric-row-v { display: flex; align-items: center; gap: 9px; }
.cz-metric-num { font-family: var(--mono); font-size: 18px; font-weight: 400; letter-spacing: -.01em; }
.cz-delta-line { font-family: var(--mono); font-size: 12px; letter-spacing: .02em; display: flex; align-items: center; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border2); }
.cz-delta-glyph { font-size: 10px; }

/* table */
.cz-table-head { display: flex; align-items: center; gap: 10px; padding: 0 4px 12px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--w70); margin-bottom: 2px; }
.cz-table-head i { color: var(--accent); font-size: 13px; }
.cz-table { width: 100%; border-collapse: collapse; }
.cz-table th { text-align: left; padding: 10px 14px; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--w55); font-weight: 400; border-bottom: 1px solid var(--border); }
.cz-table th:first-child { padding-left: 4px; }
.cz-table th .cz-zchip { margin-right: 7px; vertical-align: middle; }
.cz-th-delta { text-align: center; width: 90px; }
.cz-table td { padding: 10px 14px; border-bottom: 1px solid var(--border2); font-size: 13.5px; }
.cz-table td:first-child { padding-left: 4px; }
.cz-table tr:last-child td { border-bottom: none; }
.cz-td-label { color: var(--w70); }
.cz-td-num { font-family: var(--mono); font-size: 14px; color: var(--white); }
.cz-td-delta { font-family: var(--mono); font-size: 12px; text-align: center; white-space: nowrap; }
.cz-tr-accent td { background: rgba(200,168,130,0.05); }
.cz-tr-accent .cz-td-label { color: var(--accent); font-weight: 500; }
.cz-level { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid; border-radius: 50px; padding: 3px 12px; }

/* Warning banner — mismatch de índices entre zonas */
.cz-warn-banner {
  display: flex; align-items: flex-start; gap: 12px;
  background: linear-gradient(90deg, rgba(241,196,15,0.10), rgba(241,196,15,0.04));
  border: 1px solid rgba(241,196,15,0.30);
  border-left: 3px solid #f1c40f;
  border-radius: 8px; padding: 11px 14px;
  margin: 0 0 12px;
}
.cz-warn-icon {
  color: #f1c40f; font-size: 16px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  width: 22px; height: 22px;
}
.cz-warn-body { flex: 1; min-width: 0; }
.cz-warn-title {
  font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
  text-transform: uppercase; color: #f1c40f; font-weight: 600;
  margin-bottom: 4px;
}
.cz-warn-text {
  font-size: 12.5px; color: var(--w70); line-height: 1.55;
}
.cz-warn-text strong { color: var(--white); font-weight: 600; }
.cz-warn-text .cz-zchip { margin: 0 2px; vertical-align: middle; }

/* Compact table variant — para módulos de comparación */
.cz-table--compact th { padding: 8px 12px; font-size: 9.5px; }
.cz-table--compact td { padding: 8px 12px; font-size: 12.5px; }
.cz-table--compact .cz-td-num { font-size: 13px; }
.cz-table--compact .cz-td-delta { font-size: 11.5px; }

/* Metrics section — tabla + chart lado a lado */
.cz-metrics-section {
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 18px; margin-top: 6px;
}
.cz-metrics-table-wrap, .cz-metrics-chart-wrap {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 14px 12px; min-width: 0; overflow: hidden;
}
.cz-metrics-chart-canvas { position: relative; height: 220px; padding-top: 6px; }
.cz-metrics-chart-canvas canvas, .cz-bio-chart-canvas canvas { display: block; max-width: 100%; }
@media (max-width: 980px) {
  .cz-metrics-section { grid-template-columns: 1fr; }
  .cz-metrics-chart-canvas { height: 200px; }
}

/* Biodiversidad — donuts comparativos */
.cz-bio-donuts {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  margin-top: 14px;
}
.cz-bio-extra-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; margin-top: 14px; }
.cz-bio-extra-grid .cz-bio-chart-wrap:last-child { grid-column: 1 / -1; }
.cz-bio-donut {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 12px 14px 10px; box-shadow: var(--shadow-1);
  border-left: 3px solid var(--za);
}
.cz-bio-donut.zb { border-left-color: var(--zb); }
.cz-bio-donut-head {
  display: flex; align-items: center; gap: 9px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border2);
  margin-bottom: 10px;
}
.cz-bio-donut-name {
  flex: 1; font-size: 13px; color: var(--white);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cz-bio-donut-total {
  font-family: var(--mono); font-size: 10px; color: var(--w55);
  letter-spacing: .04em;
}
.cz-bio-donut-canvas { position: relative; height: 200px; }
@media (max-width: 760px) {
  .cz-bio-donuts { grid-template-columns: 1fr; }
  .cz-bio-extra-grid { grid-template-columns: 1fr; }
  .cz-bio-extra-grid .cz-bio-chart-wrap:last-child { grid-column: auto; }
}

/* Biodiversidad — top amenazadas comparativa */
.cz-bio-top-section { margin-top: 14px; }
.cz-bio-shared-pill {
  font-family: var(--mono); font-size: 9.5px;
  background: rgba(106,170,53,0.14); color: var(--data);
  border: 1px solid rgba(106,170,53,0.3); border-radius: 50px;
  padding: 2px 9px; letter-spacing: .06em; margin-left: 8px;
}
.cz-bio-top-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  margin-top: 10px;
}
.cz-bio-top-col {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 10px 12px; box-shadow: var(--shadow-1);
}
.cz-bio-top-col-head {
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border2);
  margin-bottom: 6px;
  font-family: var(--mono); font-size: 10.5px; color: var(--w70);
  letter-spacing: .04em;
}
.cz-bio-top-row {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 2px; font-size: 12.5px; color: var(--white);
  border-bottom: 1px solid var(--border2);
}
.cz-bio-top-row:last-child { border-bottom: none; }
.cz-bio-top-row.shared { background: rgba(106,170,53,0.04); }
.cz-bio-top-cat {
  font-family: var(--mono); font-size: 9.5px; font-weight: 700;
  padding: 2px 5px; border-radius: 3px; color: #fff;
  letter-spacing: .04em; flex-shrink: 0; min-width: 26px; text-align: center;
}
.cz-bio-top-cat.CR { background: #e74c3c; }
.cz-bio-top-cat.EN { background: #e67e22; }
.cz-bio-top-cat.VU { background: #f1c40f; color: #333; }
.cz-bio-top-cat.NT { background: #7bed9f; color: #333; }
.cz-bio-top-cat.LC { background: #4a7c2e; }
.cz-bio-top-name {
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-style: italic;
}
.cz-bio-top-share { color: var(--data); font-size: 10px; }
.cz-bio-top-empty {
  font-family: var(--mono); font-size: 11px; color: var(--w40);
  padding: 14px 4px; text-align: center;
}
@media (max-width: 760px) {
  .cz-bio-top-grid { grid-template-columns: 1fr; }
}

/* ARClim — tabla resumen */
.cz-arclim-summary {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 14px 12px;
  margin-top: 14px;
}

/* ARClim — controles del chart (toggle simulaciones + legend) */
.cz-arclim-chart-controls {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.cz-sims-toggle {
  display: inline-flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
  font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--w70);
}
.cz-sims-toggle input { display: none; }
.cz-sims-track {
  position: relative; width: 28px; height: 14px;
  border-radius: 999px; background: rgba(244,247,241,0.08);
  border: 1px solid var(--border); transition: background .2s, border-color .2s;
  flex-shrink: 0;
}
.cz-sims-dot {
  position: absolute; top: 1px; left: 1px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--w40); transition: transform .2s, background .2s;
}
.cz-sims-toggle input:checked + .cz-sims-track {
  background: rgba(106,170,53,0.22);
  border-color: rgba(106,170,53,0.45);
}
.cz-sims-toggle input:checked + .cz-sims-track .cz-sims-dot {
  transform: translateX(13px);
  background: var(--data);
}
.cz-sims-toggle:hover .cz-sims-track { border-color: var(--w40); }
.cz-sims-label { white-space: nowrap; }

/* ── LOADING ── */
.cz-boot {
  height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; background: var(--bg); color: var(--w40); font-family: var(--mono);
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
}
.cz-boot-spin {
  width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid var(--border); border-top-color: var(--accent);
  animation: cz-spin .8s linear infinite;
}
@keyframes cz-spin { to { transform: rotate(360deg); } }

/* ── UPGRADE ── */
.cz-upgrade {
  height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--bg);
}
.cz-upgrade-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 18px;
  padding: 44px 40px; text-align: center; max-width: 380px; width: 90%;
}
.cz-upgrade-icon { font-size: 32px; color: var(--accent); margin-bottom: 18px; opacity: .85; }
.cz-upgrade-title { font-family: var(--serif); font-size: 22px; margin-bottom: 10px; }
.cz-upgrade-text { font-size: 13.5px; color: var(--w55); line-height: 1.7; margin-bottom: 26px; }
.cz-upgrade-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--accent); color: var(--bg); padding: 10px 24px;
  border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; transition: filter .2s;
}
.cz-upgrade-btn:hover { filter: brightness(1.08); }

/* no-data state inside tile/detail */
.cz-nodata {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 28px 16px; gap: 8px; color: var(--w40);
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
}
.cz-nodata i { font-size: 20px; opacity: .35; }

/* ── PISO VEGETACIONAL strip ── */
.cz-piso { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 7px; }
.cz-piso-head { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 7px; }
.cz-piso-head i { font-size: 10px; }
.cz-piso-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cz-piso-row { display: flex; align-items: flex-start; gap: 9px; font-size: 12px; line-height: 1.5; color: var(--w70); }
.cz-piso-row .cz-zchip { flex-shrink: 0; margin-top: 1px; }
.cz-piso-row em { font-style: italic; color: var(--w55); font-size: 11px; }

/* ── ARCLIM dashboard ── */
.cz-arclim { display: flex; flex-direction: column; gap: 14px; }
.cz-arclim-comunas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cz-arclim-comuna { background: var(--card); border: 1px solid var(--border); border-left-width: 3px; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.cz-arclim-comuna.za { border-left-color: var(--za); }
.cz-arclim-comuna.zb { border-left-color: var(--zb); }
.cz-arclim-comuna-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.cz-arclim-comuna-label { font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--w40); }
.cz-arclim-comuna-name { font-family: var(--serif); font-size: 15px; font-weight: 500; color: var(--white); }
.cz-arclim-comuna-state { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: var(--w55); }

/* indicator dropdown (executive style) */
.cz-arclim-picker { position: relative; }
.cz-arclim-picker-btn {
  width: 100%;
  display: flex; align-items: center; gap: 14px;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 16px; text-align: left; cursor: pointer; transition: border-color .15s, background .15s;
}
.cz-arclim-picker-btn:hover { background: rgba(255,255,255,0.04); border-color: rgba(200,168,130,0.25); }
.cz-arclim-picker-btn.open { border-color: rgba(200,168,130,0.35); background: rgba(255,255,255,0.04); }
.cz-arclim-picker-tag {
  font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--w40); flex-shrink: 0;
}
.cz-arclim-picker-name {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 2px;
}
.cz-arclim-picker-title {
  font-family: var(--serif); font-size: 16px; font-weight: 500; color: var(--white);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cz-arclim-picker-sub {
  font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--w40); text-transform: uppercase;
}
.cz-arclim-picker-caret { font-size: 11px; color: var(--w40); transition: transform .2s; flex-shrink: 0; }
.cz-arclim-picker-btn.open .cz-arclim-picker-caret { transform: rotate(180deg); }

.cz-arclim-picker-menu {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 1300;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 6px; box-shadow: 0 18px 44px rgba(0,0,0,0.55);
  max-height: 360px; overflow-y: auto;
}
.cz-arclim-picker-group { padding: 8px 8px 2px; }
.cz-arclim-picker-group-label {
  font-family: var(--mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--w40); padding-bottom: 6px; border-bottom: 1px solid var(--border2); margin-bottom: 4px;
}
.cz-arclim-picker-item {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 7px; background: transparent; border: none;
  text-align: left; cursor: pointer; transition: background .12s; color: var(--w70);
  font-size: 12.5px;
}
.cz-arclim-picker-item:hover { background: rgba(255,255,255,0.04); color: var(--white); }
.cz-arclim-picker-item.sel { background: rgba(200,168,130,0.10); color: var(--white); }
.cz-arclim-picker-radio {
  width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--w25); flex-shrink: 0; position: relative;
}
.cz-arclim-picker-item.sel .cz-arclim-picker-radio { border-color: var(--accent); }
.cz-arclim-picker-item.sel .cz-arclim-picker-radio::after {
  content: ''; position: absolute; inset: 2px; border-radius: 50%; background: var(--accent);
}
.cz-arclim-picker-item-name { flex: 1; min-width: 0; }
.cz-arclim-picker-item-unit { font-family: var(--mono); font-size: 9.5px; color: var(--w40); }

.cz-arclim-chart-wrap {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.cz-arclim-chart-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.cz-arclim-chart-title { font-family: var(--serif); font-size: 17px; color: var(--white); }
.cz-arclim-chart-sub { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; color: var(--w40); text-transform: uppercase; }
.cz-arclim-chart-legend { display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--w55); }
.cz-arclim-chart-legend i { font-style: normal; display: inline-block; width: 22px; height: 2px; vertical-align: middle; margin-right: 6px; }
.cz-arclim-chart-canvas { position: relative; height: 320px; }
.cz-arclim-loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 60px 20px; color: var(--w55); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.cz-arclim-loading .cz-boot-spin { width: 18px; height: 18px; border-width: 2px; }

.cz-arclim-deltas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.cz-arclim-delta {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 6px;
}
.cz-arclim-delta-lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--w40); display: flex; align-items: center; gap: 7px; }
.cz-arclim-delta-vals { font-family: var(--mono); font-size: 16px; display: flex; align-items: baseline; gap: 8px; }
.cz-arclim-delta-vals span:nth-child(1) { color: var(--w70); }
.cz-arclim-delta-vals i { font-size: 10px; color: var(--w40); }
.cz-arclim-delta-vals span:nth-child(3) { color: var(--white); }
.cz-arclim-delta-diff { font-family: var(--mono); font-size: 11px; padding-top: 4px; border-top: 1px solid var(--border2); }

/* ── BIO charts ── */
.cz-bio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
.cz-bio-card { background: var(--mat-1); border: 0.5px solid var(--hairline); border-left-width: 3px; border-radius: var(--r-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-1); }
.cz-bio-card.za { border-left-color: var(--za); }
.cz-bio-card.zb { border-left-color: var(--zb); }
.cz-bio-card-head { display: flex; align-items: center; gap: 9px; }
.cz-bio-card-name { font-family: var(--serif); font-size: 14px; color: var(--white); }
.cz-bio-card-meta { font-family: var(--mono); font-size: 9.5px; letter-spacing: .04em; color: var(--w40); margin-left: auto; text-transform: uppercase; }
.cz-bio-card-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.cz-bio-stat { background: rgba(31,61,28,0.045); border-radius: var(--r-xs); padding: 8px 9px; }
.cz-bio-stat-val { font-family: var(--mono); font-size: 19px; color: var(--white); letter-spacing: -.02em; }
.cz-bio-stat-lbl { font-family: var(--mono); font-size: 8.5px; letter-spacing: .08em; color: var(--w40); text-transform: uppercase; margin-top: 2px; }
.cz-bio-stat.cr .cz-bio-stat-val { color: var(--neg); }
.cz-bio-stat.en .cz-bio-stat-val { color: #d9a441; }
.cz-bio-stat.vu .cz-bio-stat-val { color: #d9a441; }

.cz-bio-chart-wrap { background: var(--mat-1); border: 0.5px solid var(--hairline); border-radius: var(--r-md); padding: 16px; box-shadow: var(--shadow-1); }
.cz-bio-chart-canvas { position: relative; height: 220px; }
.cz-bio-toplist { display: flex; flex-direction: column; gap: 6px; }
.cz-bio-toplist-title { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--w40); margin-bottom: 4px; }
.cz-bio-toplist-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; padding: 5px 0; border-bottom: 1px solid var(--border2); }
.cz-bio-toplist-row:last-child { border-bottom: none; }
.cz-bio-toplist-cat { font-family: var(--mono); font-size: 9px; padding: 2px 6px; border-radius: 50px; border: 1px solid; letter-spacing: .06em; }
.cz-bio-toplist-cat.CR { color: var(--neg); border-color: var(--neg); background: rgba(224,92,92,0.08); }
.cz-bio-toplist-cat.EN { color: #d9a441; border-color: #d9a441; background: rgba(217,164,65,0.08); }
.cz-bio-toplist-cat.VU { color: #d9a441; border-color: rgba(217,164,65,0.5); background: rgba(217,164,65,0.05); }
.cz-bio-toplist-cat.NT { color: var(--w55); border-color: var(--border); }
.cz-bio-toplist-name { color: var(--white); font-style: italic; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cz-bio-toplist-obs { font-family: var(--mono); font-size: 10px; color: var(--w55); }

.cz-bio-reanalyze {
  display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--accent);
  background: rgba(200,168,130,0.08); border: 1px solid rgba(200,168,130,0.3);

}
.cz-bio-reanalyze:hover { background: rgba(200,168,130,0.16); }
.cz-bio-reanalyze i { font-size: 11px; }

/* ══ SERIES ESTACIONALES (Fase C) ══ */
.cz-series { display: flex; flex-direction: column; gap: 14px; }

/* Barra de control: selector de serie + métrica */
.cz-series-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-bottom: 12px; border-bottom: 0.5px solid var(--hairline-soft);
}
.cz-series-pick { position: relative; }
.cz-series-pick-btn {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--mat-1); border: 0.5px solid var(--hairline);
  border-radius: var(--r-sm); padding: 7px 12px; box-shadow: var(--shadow-1);
  transition: background .2s var(--ease);
}
.cz-series-pick-btn:hover { background: var(--mat-2); }
.cz-series-pick-label { display: flex; flex-direction: column; gap: 2px; text-align: left; }
.cz-series-pick-title { font-size: 12.5px; color: var(--white); font-weight: 500; }
.cz-series-pick-meta { font-family: var(--mono); font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--w40); }
.cz-series-pick-menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 1200; min-width: 300px;
  background: var(--panel); color: var(--white);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 0.5px solid var(--hairline); border-radius: var(--r-md);
  padding: 6px; box-shadow: var(--shadow-2); max-height: 320px; overflow-y: auto;
}
.cz-series-opt {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 9px 11px; border-radius: var(--r-xs); transition: background .15s var(--ease);
}
.cz-series-opt:hover { background: rgba(31,61,28,0.06); }
.cz-series-opt.sel { background: rgba(106,170,53,0.10); }
.cz-series-opt-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cz-series-opt-name { font-size: 12.5px; color: var(--white); }
.cz-series-opt-meta { font-family: var(--mono); font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--w40); }
/* Puntos que indican en qué zonas existe la serie */
.cz-series-dots { display: flex; gap: 4px; flex-shrink: 0; }
.cz-series-dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid; }
.cz-series-dot--a { border-color: var(--za); }
.cz-series-dot--b { border-color: var(--zb); }
.cz-series-dot.on--a { background: var(--za); }
.cz-series-dot.on--b { background: var(--zb); }

/* Gráfico */
.cz-series-chart {
  position: relative; height: 300px;
  background: rgba(31,61,28,0.035); border: 0.5px solid var(--hairline-soft);
  border-radius: var(--r-md); padding: 12px 14px 8px;
}
.cz-series-legend { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.cz-series-leg { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--w70); }
.cz-series-leg-line { width: 16px; height: 2.5px; border-radius: 2px; flex-shrink: 0; }
.cz-series-class-leg { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; color: var(--w70); }
.cz-series-class-dot, .cz-dnbr-class-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; border: 1px solid rgba(29,43,29,.18); }
.cz-dnbr-legend { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin: 0 0 10px; }
.cz-dnbr-table-wrap { background: var(--mat-1); border: 0.5px solid var(--hairline); border-radius: var(--r-md); padding: 8px 10px; box-shadow: var(--shadow-1); }
.cz-dnbr-table-wrap .cz-table td { padding-top: 7px; padding-bottom: 7px; }
.cz-dnbr-class-dot { margin-right: 7px; vertical-align: middle; }
.cz-dnbr-zones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cz-dnbr-zone-panel {
  min-width: 0; background: var(--mat-1); border: 0.5px solid var(--hairline);
  border-left: 3px solid var(--za); border-radius: var(--r-md); padding: 12px 14px 10px;
  box-shadow: var(--shadow-1); overflow: hidden;
}
.cz-dnbr-zone-panel.zb { border-left-color: var(--zb); }
.cz-dnbr-zone-head { display: flex; align-items: center; gap: 9px; min-width: 0; padding-bottom: 9px; border-bottom: 0.5px solid var(--hairline-soft); }
.cz-dnbr-zone-name { min-width: 0; flex: 1; font-family: var(--serif); font-size: 14px; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cz-dnbr-zone-period { font-family: var(--mono); font-size: 8.5px; color: var(--w40); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.cz-dnbr-zone-legend { display: flex; flex-wrap: wrap; gap: 7px 11px; padding: 9px 0 2px; }
.cz-dnbr-zone-chart { position: relative; height: 264px; min-width: 0; margin-top: 2px; }
.cz-dnbr-zone-table { min-width: 0; overflow-x: auto; margin-top: 5px; }
.cz-dnbr-zone-table .cz-table { min-width: 360px; }
.cz-dnbr-zone-table .cz-table th, .cz-dnbr-zone-table .cz-table td { padding-left: 7px; padding-right: 7px; }
.cz-dnbr-zone-table .cz-table th:first-child, .cz-dnbr-zone-table .cz-table td:first-child { padding-left: 0; }
.cz-dnbr-zone-table .cz-table th:last-child, .cz-dnbr-zone-table .cz-table td:last-child { text-align: right; }
.cz-dnbr-zone-empty { min-height: 264px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--w40); font-family: var(--mono); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
@media (max-width: 900px) { .cz-dnbr-zones { grid-template-columns: 1fr; } }

/* ── Series estacionales: un panel por zona (mismo patrón que dNBR) ── */
.cz-series-zones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cz-serie-panel {
  min-width: 0; background: var(--mat-1); border: 0.5px solid var(--hairline);
  border-left: 3px solid var(--za); border-radius: var(--r-md); padding: 12px 14px 10px;
  box-shadow: var(--shadow-1); overflow: hidden;
  display: flex; flex-direction: column;
}
.cz-serie-panel.zb { border-left-color: var(--zb); }
.cz-serie-panel-chart { position: relative; height: 210px; min-width: 0; margin: 8px 0 2px; }
.cz-serie-panel-empty {
  min-height: 210px; display: flex; align-items: center; justify-content: center;
  color: var(--w40); font-family: var(--mono); font-size: 10px;
  letter-spacing: .04em; text-transform: uppercase; text-align: center; padding: 0 12px;
}
@media (max-width: 900px) { .cz-series-zones { grid-template-columns: 1fr; } }

/* Chips de selección (estación / índice) — reemplazan el desplegable mixto */
.cz-chiprow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cz-chiprow-lbl {
  font-family: var(--mono); font-size: 9px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--w40); margin-right: 2px;
}
.cz-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 11px; border-radius: 999px;
  background: rgba(255,255,255,0.055); border: 0.5px solid var(--hairline-soft);
  color: var(--w70); font-size: 12px; line-height: 1.1;
  transition: background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
}
.cz-chip:hover { background: rgba(255,255,255,0.10); color: var(--white); }
.cz-chip.active {
  background: var(--accent);
  border-color: var(--accent); color: #fff; font-weight: 600;
  box-shadow: 0 1px 4px rgba(77,138,31,0.25);
}
.cz-chip-sub { font-family: var(--mono); font-size: 8.5px; letter-spacing: .05em; text-transform: uppercase; opacity: .6; }
/* Puntos que indican en qué zonas existe esa combinación */
.cz-chip-dots { display: inline-flex; gap: 3px; }
.cz-chip-dot { width: 6px; height: 6px; border-radius: 50%; border: 1px solid; }
.cz-chip-dot--a { border-color: var(--za); }
.cz-chip-dot--b { border-color: var(--zb); }
.cz-chip-dot.on--a { background: var(--za); }
.cz-chip-dot.on--b { background: var(--zb); }
/* Visor de imágenes año a año — selector de año por panel */
.cz-imgrow { border-top: 0.5px dashed var(--hairline-soft); padding-top: 8px; margin-top: 2px; }
.cz-imgyear { display: inline-flex; align-items: center; gap: 5px; }
.cz-imgyear select { font-family: var(--mono); font-size: 11px; padding: 4px 8px; border-radius: 8px; border: 0.5px solid var(--hairline); background: #fff; color: var(--white); cursor: pointer; }
/* Panel ordenado de serie estacional (índice / estación / vista como listas) */
.cz-serie-grid { display: grid; grid-template-columns: 88px minmax(0,1fr); gap: 9px 12px; align-items: center; width: 100%; max-width: 470px; }
.cz-serie-lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--w55); }
.cz-serie-sel { font-family: var(--mono); font-size: 12px; padding: 6px 9px; border-radius: 8px; border: 0.5px solid var(--hairline); background: #fff; color: var(--white); cursor: pointer; width: 100%; }
.cz-serie-divider { border-top: 0.5px dashed var(--hairline-soft); margin: 3px 0; width: 100%; max-width: 470px; }
/* Stepper de año en la cabecera de cada mapa (serie histórica) */
.cz-yearstep { margin-left:auto; display:inline-flex; align-items:center; gap:2px; background:#fff; border:0.5px solid var(--border); border-radius:999px; padding:2px 3px; flex:none; }
.cz-yearstep-btn { width:22px; height:22px; border:none; background:none; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--w70); font-size:11px; }
.cz-yearstep-btn:hover:not(:disabled) { background:var(--bg); color:var(--white); }
.cz-yearstep-btn:disabled { opacity:.3; cursor:default; }
.cz-yearstep-val { font-family:var(--mono); font-size:12px; font-weight:500; color:var(--white); min-width:32px; text-align:center; }

/* Tarjetas de tendencia por zona (lista agrupada tipo Ajustes de iOS) */
.cz-series-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cz-series-card {
  background: var(--mat-1); border: 0.5px solid var(--hairline); border-left-width: 3px;
  border-radius: var(--r-md); box-shadow: var(--shadow-1); overflow: hidden;
}
.cz-series-card.za { border-left-color: var(--za); }
.cz-series-card.zb { border-left-color: var(--zb); }
.cz-series-card-head {
  display: flex; align-items: center; gap: 9px; padding: 11px 14px;
  border-bottom: 0.5px solid var(--hairline-soft);
}
.cz-series-card-name { font-family: var(--serif); font-size: 14px; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cz-series-card-tag {
  margin-left: auto; flex-shrink: 0; font-family: var(--mono); font-size: 8.5px;
  letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px;
  border: 0.5px solid var(--hairline); color: var(--w40);
}
.cz-series-card-tag.sig { color: var(--accent); border-color: rgba(200,168,130,.45); background: rgba(200,168,130,.10); }
.cz-series-rows { display: flex; flex-direction: column; }
.cz-series-row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  padding: 9px 14px; border-bottom: 0.5px solid var(--hairline-soft);
}
.cz-series-row:last-child { border-bottom: none; }
.cz-series-row-lbl { font-size: 11.5px; color: var(--w55); }
.cz-series-row-val { font-family: var(--mono); font-size: 14px; color: var(--white); letter-spacing: -.01em; }
.cz-series-row-val.pos { color: var(--data); }
.cz-series-row-val.neg { color: var(--neg); }
.cz-series-row-val.na  { color: var(--w40); font-size: 12px; }

/* Aviso (umbral distinto, serie en una sola zona, etc.) */
.cz-series-note {
  display: flex; align-items: flex-start; gap: 9px;
  background: rgba(217,164,65,0.09); border: 0.5px solid rgba(217,164,65,0.30);
  border-radius: var(--r-sm); padding: 10px 13px; font-size: 11.5px; line-height: 1.5; color: var(--w90);
}
.cz-series-note i { color: #d9a441; font-size: 12px; margin-top: 1px; flex-shrink: 0; }

/* Estado vacío */
.cz-series-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 54px 24px; text-align: center; color: var(--w40);
}
.cz-series-empty i { font-size: 30px; opacity: .3; }
.cz-series-empty-t { font-size: 13.5px; color: var(--w70); }
.cz-series-empty-s { font-size: 11.5px; max-width: 400px; line-height: 1.6; }

@media (max-width: 1100px) { .cz-series-cards { grid-template-columns: 1fr; } }

/* Leaflet dark tweaks */
.leaflet-container { background: var(--mapbg); font-family: var(--mono); }
.leaflet-control-zoom a { background: rgba(4,14,4,0.88) !important; color: #e8ede8 !important; border-color: rgba(255,255,255,0.18) !important; }
.leaflet-control-zoom a:hover { background: rgba(15,28,14,0.98) !important; color: #ffffff !important; }
.leaflet-control-attribution { background: rgba(4,14,4,0.7) !important; color: var(--w40) !important; font-size: 9px !important; }

@media (max-width: 1100px) { .cz-kpis { grid-template-columns: repeat(2,1fr); } .cz-metrics-row { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 860px) { .cz-body { flex-direction: column; } .cz-sidebar { width: auto; border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; } .cz-tiles { grid-template-columns: 1fr; height: auto; } .cz-tile { height: 280px; } }

<script>

  const MODULES = [
    { id:'vegetacion', label:'Vegetación',    icon:'fa-seedling',             type:'map',
      prefix:'vegetacion_', index:'NDVI', cmap:'ndvi', legendMin:'0.0', legendMax:'1.0',
      metrics:[
        {key:'mean',   label:'NDVI prom',      fmt:'dec', better:'high'},

        {key:'stdDev', label:'Desv. est.',     fmt:'dec', better:'none'},
      ]},
    { id:'agua', label:'Agua', icon:'fa-droplet', type:'map',
      prefix:'agua_', index:'NDWI', cmap:'ndwi', legendMin:'-0.3', legendMax:'0.6',
      metrics:[
        {key:'mean', label:'NDWI prom',      fmt:'dec', better:'high'},

    { id:'elevacion', label:'Elevación', icon:'fa-mountain', type:'map',

        {key:'mean', label:'Elev. media', fmt:'int', unit:'m', better:'none'},
        {key:'max',  label:'Cota máxima', fmt:'int', unit:'m', better:'none'},
        {key:'min',  label:'Cota mínima', fmt:'int', unit:'m', better:'none'},
      ]},
    // Severidad de quema (dNBR). Reemplaza al antiguo módulo "Bosque", que

    { id:'dnbr', label:'Severidad', icon:'fa-fire', type:'map',

    { id:'biodiversidad', label:'Biodiversidad', icon:'fa-paw', type:'bio',
      prefix:'biodiversidad_',

        {id:'summer_days',          grupo:'calor',  icon:'fa-thermometer-full', label:'Días de verano',           unit:'días/año'},
        {id:'tropical_nights',      grupo:'calor',  icon:'fa-moon',             label:'Noches tropicales',        unit:'noches/año'},
        {id:'frost_days',           grupo:'frio',   icon:'fa-snowflake',        label:'Días de helada',           unit:'días/año'},
        {id:'cool_days',            grupo:'frio',   icon:'fa-wind',             label:'Días frescos',             unit:'días/año'},
        {id:'consecutive_dry_days', grupo:'sequia', icon:'fa-tint-slash',       label:'Días secos consecutivos',  unit:'días'},
        {id:'consecutive_wet_days', grupo:'lluvia', icon:'fa-cloud-rain',       label:'Días húmedos consecutivos',unit:'días'},

  function polyFromGeoJSON(geo){
    if(!geo||!geo.geometry||geo.geometry.type!=='Polygon') return [];
    return geo.geometry.coordinates[0].map(function(c){return[c[1],c[0]];});

  function boundsOfPoly(poly){
    if(!poly.length) return null;

<script>
(function(){
  'use strict';
  function hexToRgb(h){var n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
  function rampColor(stops,t){
    t=Math.max(0,Math.min(1,t));
    var seg=t*(stops.length-1),i=Math.floor(seg),f=seg-i;
    var a=hexToRgb(stops[i]),b=hexToRgb(stops[Math.min(i+1,stops.length-1)]);
    return[Math.round(a[0]+(b[0]-a[0])*f),Math.round(a[1]+(b[1]-a[1])*f),Math.round(a[2]+(b[2]-a[2])*f)];
  }
  function legendGradient(cmapKey){
    var stops=CZ.COLORMAPS[cmapKey];
    var parts=stops.map(function(c,i){return c+' '+Math.round(i/(stops.length-1)*100)+'%';});
    return'linear-gradient(90deg,'+parts.join(',')+')';
  }
  const BASE_MAPS = {
    satelite: {label:'Satélite', icon:'fa-satellite', url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attribution:'Tiles © Esri'},
    claro:    {label:'Claro analítico', icon:'fa-sun', url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', attribution:'© OpenStreetMap contributors © CARTO', subdomains:'abcd'},
    oscuro:   {label:'Oscuro analítico', icon:'fa-moon', url:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', attribution:'© OpenStreetMap contributors © CARTO', subdomains:'abcd'}
  };
  function setBaseMap(map,baseId){
    if(!map||!map._czBaseLayers) return;
    var selected=BASE_MAPS[baseId]?baseId:'satelite';
    var next=map._czBaseLayers[selected];
    if(!next) return;

    // Leaflet puede fallar al desmontar una TileLayer que todavía está
    // procesando teselas. Activamos primero la nueva capa y aislamos la
    // limpieza para que el cambio de fondo nunca desmonte React.
    try{
      if(!map.hasLayer(next)) next.addTo(map);
      if(next.setOpacity) next.setOpacity(1);
    }catch(e){
      console.warn('[Comparador] No se pudo activar el mapa base',selected,e);
      return;
    }
    Object.keys(map._czBaseLayers).forEach(function(id){
      if(id===selected) return;
      var layer=map._czBaseLayers[id];
      try{
        if(map.hasLayer(layer)){
          if(layer.setOpacity) layer.setOpacity(0);
          map.removeLayer(layer);
        }
      }catch(e){
        // Si la capa no alcanza a desmontarse, dejarla invisible es seguro.
        try{if(layer.setOpacity) layer.setOpacity(0);}catch(ignore){}
      }
    });
    if(map._czLabels){
      try{
        if(selected==='satelite'){
          if(!map.hasLayer(map._czLabels)) map._czLabels.addTo(map);
          if(map._czLabels.setOpacity) map._czLabels.setOpacity(0.7);
        }else{
          if(map._czLabels.setOpacity) map._czLabels.setOpacity(0);
          if(map.hasLayer(map._czLabels)) map.removeLayer(map._czLabels);
        }
      }catch(e){
        try{if(map._czLabels.setOpacity) map._czLabels.setOpacity(selected==='satelite'?0.7:0);}catch(ignore){}
      }
    }
    map._czBaseId=selected;
  }
  function createBaseMap(el,zone,baseId){
    var center=zone&&zone.lat?[zone.lat,zone.lng]:[-37.5,-71];
    var zoom=zone&&zone.zoom?zone.zoom:9;
    var map=L.map(el,{center:center,zoom:zoom,zoomControl:true,attributionControl:true,zoomSnap:0.5,maxZoom:18,minZoom:5,fadeAnimation:false});
    // ESRI World Imagery (satélite) — mismo base que acceso-datos.html (consistencia)
    var initialSatellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
      attribution:'Tiles © Esri',
      maxZoom:18
    }).addTo(map);
    // Etiquetas semitransparentes sobre el satélite (ciudades, ríos, calles)
    var initialLabels=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{
      opacity:0.7, maxZoom:18
    }).addTo(map);
    map._czBaseLayers={satelite:initialSatellite};
    Object.keys(BASE_MAPS).forEach(function(id){
      if(id==='satelite') return;
      var cfg=BASE_MAPS[id];
      map._czBaseLayers[id]=L.tileLayer(cfg.url,{attribution:cfg.attribution,subdomains:cfg.subdomains,maxZoom:18});
    });
    map._czLabels=initialLabels;
    map._czBaseId='satelite';
    if(baseId&&baseId!=='satelite') setBaseMap(map,baseId);
    map.zoomControl.setPosition('topright');
    map.attributionControl.setPrefix('');
    return map;
  }
  async function drawZone(map,handles,zone,mod,accent,opacity,zoneData){
    if(handles.overlay){try{map.removeLayer(handles.overlay);}catch(e){}handles.overlay=null;}
    if(handles.poly){try{map.removeLayer(handles.poly);}catch(e){}handles.poly=null;}
    if(handles.streams){handles.streams.forEach(function(l){try{map.removeLayer(l);}catch(e){}});handles.streams=null;}
    if(zone&&zone.poly&&zone.poly.length){
      handles.poly=L.polygon(zone.poly,{color:accent,weight:2,opacity:0.9,fillColor:accent,fillOpacity:0.05}).addTo(map);
    }
    if(mod&&mod.type==='map'&&zoneData&&zoneData[mod.id]){
      var md=zoneData[mod.id];
      if(md.previewPath&&md.previewBounds){
        try{
          var res=await supabase.storage.from('result-previews').createSignedUrl(md.previewPath,3600);
          if(res.data&&res.data.signedUrl){
            handles.overlay=L.imageOverlay(res.data.signedUrl,md.previewBounds,{opacity:opacity,interactive:false}).addTo(map);
          }
        }catch(e){console.warn('overlay error',e);}
      }
    }
    // Capa complementaria de streams (guardada desde Hidromorfología junto a la cuenca).
    // Se dibuja al final para quedar por encima del ráster del módulo.
    if(zoneData&&zoneData._streams){
      try{
        var sd=zoneData._streams;
        var sName=sd.name||'streams';
        handles.streams=[];
        if(sd.streams&&sd.streams.features&&sd.streams.features.length){
          handles.streams.push(L.geoJSON(sd.streams,{style:{color:'#2171b5',weight:1.1,opacity:0.9,lineCap:'round',lineJoin:'round'}}).bindTooltip(sName,{sticky:true}).addTo(map));
        }
        if(sd.cauce_principal&&sd.cauce_principal.coordinates&&sd.cauce_principal.coordinates.length){
          handles.streams.push(L.geoJSON(sd.cauce_principal,{style:{color:'#08306b',weight:2.4,opacity:1,lineCap:'round',lineJoin:'round'}}).addTo(map));
        }
        handles.streams.forEach(function(l){try{l.bringToFront();}catch(e){}});
      }catch(e){console.warn('streams draw',e);}
    }
  }
  function fitZone(map,zone,zoneData,modId){
    var b=null;
    if(zoneData&&modId&&zoneData[modId]&&zoneData[modId].previewBounds) b=zoneData[modId].previewBounds;
    else if(zone&&zone.bounds) b=zone.bounds;
    if(b) map.fitBounds(b,{padding:[18,18],animate:false});
    else if(zone&&zone.lat) map.setView([zone.lat,zone.lng],zone.zoom||10,{animate:false});
  }
  function linkSync(mapA,mapB,gate){
    var lock=false;
    function sync(src,dst){
      return function(){
        if(lock||!gate.enabled) return;
        lock=true;
        dst.setView(src.getCenter(),src.getZoom(),{animate:false});
        lock=false;
      };
    }
    var hA=sync(mapA,mapB),hB=sync(mapB,mapA);
    mapA.on('moveend',hA); mapB.on('moveend',hB);
    return function(){mapA.off('moveend',hA);mapB.off('moveend',hB);};
  }
  window.CZMap={BASE_MAPS,legendGradient,createBaseMap,setBaseMap,drawZone,fitZone,linkSync};
})();
</script>

<script type="text/babel">
'use strict';
const {useState,useEffect,useRef,useMemo,useCallback}=React;

/* ── formatters ── */
function czFmt(v,fmt,unit){
  if(v==null||typeof v!=='number') return '—';
  if(fmt==='dec') return v.toFixed(2);
  if(fmt==='pct') return v+'%';
  if(fmt==='ha')  return Math.round(v).toLocaleString('es-CL')+' ha';
  if(fmt==='int') return Math.round(v).toLocaleString('es-CL')+(unit?' '+unit:'');
  return String(v);
}
function czFmtDelta(d,fmt,unit){
  var s=d>0?'+':d<0?'−':'';
  var a=Math.abs(d);
  if(fmt==='dec') return s+a.toFixed(2);
  if(fmt==='pct') return s+a+'%';
  if(fmt==='ha')  return s+Math.round(a).toLocaleString('es-CL')+' ha';
  if(fmt==='int') return s+Math.round(a).toLocaleString('es-CL')+(unit?' '+unit:'');
  return s+a;
}
function czDelta(a,b,better){
  if(a==null||b==null) return{arrow:'—',sentiment:'neutral',diff:0};
  var diff=b-a;
  var arrow=diff>0.0001?'▲':diff<-0.0001?'▼':'▬';
  var sentiment='neutral';
  if(better==='high') sentiment=diff>0?'good':diff<0?'bad':'neutral';
  if(better==='low')  sentiment=diff<0?'good':diff>0?'bad':'neutral';
  return{arrow,sentiment,diff};
}
const sentColor=s=>s==='good'?'var(--data)':s==='bad'?'var(--neg)':'var(--w55)';

/* ── zone selector ── */
function ZoneSelect({side,zone,otherId,onPick,zones}){

}

/* ── KPI card ── */
const KPIS=[
  {id:'ndvi',label:'NDVI prom',icon:'fa-seedling',mod:'vegetacion',key:'mean',fmt:'dec',better:'high'},
  {id:'ndwi',label:'NDWI prom',icon:'fa-droplet', mod:'agua',      key:'mean',fmt:'dec',better:'high'},
  {id:'elev',label:'Elevación', icon:'fa-mountain',mod:'elevacion', key:'mean',fmt:'int',unit:'m',better:'none'},
  {id:'esp', label:'Especies',  icon:'fa-paw',     mod:'biodiversidad',key:'n_especies',fmt:'int',better:'high'},
];

/* ══ NUEVO: Ficha técnica + Radar de similitud (reemplaza tira de KPIs) ══ */

// Calcula perímetro en km a partir del polígono [[lat,lng],...]
function polyPerimeterKm(poly){
  if(!poly||poly.length<2||typeof turf==='undefined') return null;
  try{
    // turf espera [lng,lat]; nuestro poly es [lat,lng]
    const coords=poly.map(p=>[p[1],p[0]]);
    if(coords.length>0&&(coords[0][0]!==coords[coords.length-1][0]||coords[0][1]!==coords[coords.length-1][1])){
      coords.push(coords[0]);
    }
    const line=turf.lineString(coords);
    return turf.length(line,{units:'kilometers'});
  }catch(e){return null;}
}

// Distancia entre centroides de dos zonas, en km
function zoneDistanceKm(zoneA,zoneB){
  if(!zoneA||!zoneB||typeof turf==='undefined') return null;
  try{
    const pA=turf.point([zoneA.lng,zoneA.lat]);
    const pB=turf.point([zoneB.lng,zoneB.lat]);
    return turf.distance(pA,pB,{units:'kilometers'});
  }catch(e){return null;}
}

// Compacidad de Polsby-Popper: 4π × área / perímetro²
// = 1 si es círculo perfecto · más baja = forma más alargada
function compactness(areaHa, perimKm){
  if(!areaHa||!perimKm||perimKm===0) return null;
  const areaM2  = areaHa * 10000;
  const perimM  = perimKm * 1000;
  return (4 * Math.PI * areaM2) / (perimM * perimM);
}

// Extensión Norte-Sur del bbox en metros
function extentNS(zone){
  if(!zone||!zone.bounds) return null;
  const s=zone.bounds[0][0], n=zone.bounds[1][0];
  return (n - s) * 111320;
}

// Extensión Este-Oeste del bbox en metros (corregida por latitud)
function extentEO(zone){
  if(!zone||!zone.bounds) return null;
  const s=zone.bounds[0][0], n=zone.bounds[1][0];
  const w=zone.bounds[0][1], e=zone.bounds[1][1];
  const cLat=(n+s)/2;
  return (e - w) * 111320 * Math.cos(cLat * Math.PI / 180);
}

// Redondea a número "agradable" para escala visual (1, 2, 5, 10, 20, 50...)
function niceRound(n){
  if(n<=0) return 0;
  const pow=Math.pow(10,Math.floor(Math.log10(n)));
  const frac=n/pow;
  let nice;
  if(frac<1.5) nice=1; else if(frac<3) nice=2; else if(frac<7) nice=5; else nice=10;
  return nice*pow;
}
function formatMeters(m){
  return m>=1000 ? (m/1000).toFixed(m%1000?1:0)+' km' : Math.round(m)+' m';
}
function formatLatLng(v){
  return v==null?'—':v.toFixed(3)+'°';
}

function ZonesTechSheet({zoneA,zoneB}){
  // Métricas derivadas — solo morfología, sin índices espectrales ni biodiversidad
  const perimA = useMemo(()=>zoneA?polyPerimeterKm(zoneA.poly):null,[zoneA?.id]);
  const perimB = useMemo(()=>zoneB?polyPerimeterKm(zoneB.poly):null,[zoneB?.id]);
  const compA  = useMemo(()=>compactness(zoneA?.area, perimA),[zoneA?.area, perimA]);
  const compB  = useMemo(()=>compactness(zoneB?.area, perimB),[zoneB?.area, perimB]);
  const nsA = useMemo(()=>extentNS(zoneA),[zoneA?.id]);
  const nsB = useMemo(()=>extentNS(zoneB),[zoneB?.id]);
  const eoA = useMemo(()=>extentEO(zoneA),[zoneA?.id]);
  const eoB = useMemo(()=>extentEO(zoneB),[zoneB?.id]);

  const rows=[
    {label:'Área',          a:zoneA?.area, b:zoneB?.area, unit:'ha',  fmt:'int', better:'none'},
    {label:'Perímetro',     a:perimA,      b:perimB,      unit:'km',  fmt:'dec', better:'none'},
    {label:'Compacidad',    a:compA,       b:compB,       unit:'',    fmt:'dec', better:'none', hint:'Polsby-Popper · 1 = círculo · ↓ = más alargada'},
    {label:'Extensión N–S', a:nsA,         b:nsB,         unit:'m',   fmt:'int', better:'none'},
    {label:'Extensión E–O', a:eoA,         b:eoB,         unit:'m',   fmt:'int', better:'none'},
  ];

  return(
    <div className="cz-tech-sheet">
      <div className="cz-table-head">
        <i className="fa-solid fa-ruler-combined"/>Caracterización territorial
      </div>
      <table className="cz-table cz-table--compact">
        <thead>
          <tr>
            <th>Métrica</th>
            <th><span className="cz-zchip cz-zchip--a">A</span></th>
            <th><span className="cz-zchip cz-zchip--b">B</span></th>
            <th className="cz-th-delta">Δ</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r,i)=>{
            if(r.a==null&&r.b==null) return null;
            const {arrow,sentiment,diff}=czDelta(r.a,r.b,r.better||'none');
            const sc=sentColor(sentiment);
            return(
              <tr key={i}>
                <td className="cz-td-label" title={r.hint||undefined}>{r.label}</td>
                <td className="cz-td-num">{czFmt(r.a,r.fmt,r.unit)}</td>
                <td className="cz-td-num">{czFmt(r.b,r.fmt,r.unit)}</td>
                <td className="cz-td-delta" style={{color:sc}}>
                  {r.a!=null&&r.b!=null?arrow+' '+czFmtDelta(diff,r.fmt,r.unit):'—'}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* Mini-mapa schematic: dibuja los 2 polígonos centrados, a la MISMA escala */
function ShapeMiniMap({zoneA,zoneB}){
  const ref=useRef(null);

  useEffect(()=>{
    if(!ref.current) return;
    const canvas=ref.current;
    const ctx=canvas.getContext('2d');
    const dpr=window.devicePixelRatio||1;
    const rect=canvas.getBoundingClientRect();
    canvas.width =rect.width *dpr;
    canvas.height=rect.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const W=rect.width, H=rect.height;
    ctx.clearRect(0,0,W,H);

    // Proyección local: cada polígono al sistema metros relativos a su propio centroide
    const projZone=(zone)=>{
      if(!zone||!zone.poly||zone.poly.length<3) return null;
      let cLat=0,cLng=0;
      zone.poly.forEach(p=>{cLat+=p[0];cLng+=p[1];});
      cLat/=zone.poly.length; cLng/=zone.poly.length;
      const mPerLng=111320*Math.cos(cLat*Math.PI/180);
      return zone.poly.map(p=>({
        x:(p[1]-cLng)*mPerLng,
        y:(cLat-p[0])*111320,  // invertido (canvas Y crece hacia abajo)
      }));
    };

    const pA=projZone(zoneA);
    const pB=projZone(zoneB);
    if(!pA&&!pB) return;

    // Calcular bbox combinado en metros (todos los puntos)
    const all=[...(pA||[]),...(pB||[])];
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    all.forEach(p=>{
      if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
      if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
    });
    const spanX=maxX-minX, spanY=maxY-minY;
    const span=Math.max(spanX,spanY,1)*1.20;  // 20% padding

    // Escala: que el mayor span entre en el lado más corto del canvas
    const size=Math.min(W,H)-32;
    const scale=size/span;
    const cx=W/2, cy=H/2;

    // Dibujar polígono con fill + stroke
    const drawPoly=(pts,fillStyle,strokeStyle)=>{
      if(!pts||pts.length<3) return;
      ctx.beginPath();
      pts.forEach((p,i)=>{
        const x=cx+p.x*scale;
        const y=cy+p.y*scale;
        if(i===0) ctx.moveTo(x,y);
        else      ctx.lineTo(x,y);
      });
      ctx.closePath();
      ctx.fillStyle=fillStyle;
      ctx.fill();
      ctx.strokeStyle=strokeStyle;
      ctx.lineWidth=1.6;
      ctx.stroke();
    };
    if(pA) drawPoly(pA,'rgba(200,168,130,0.22)','#C8A882');
    if(pB) drawPoly(pB,'rgba(106,170,53,0.22)','#6AAA35');

    // Barra de escala (1/4 del span, redondeado a número agradable)
    const targetMeters=span/4;
    const scaleBarMeters=niceRound(targetMeters);
    const scaleBarPx=scaleBarMeters*scale;
    const sbX=14, sbY=H-16;
    ctx.strokeStyle='rgba(29,43,29,0.55)';
    ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(sbX,sbY); ctx.lineTo(sbX+scaleBarPx,sbY);
    ctx.moveTo(sbX,sbY-3); ctx.lineTo(sbX,sbY+3);
    ctx.moveTo(sbX+scaleBarPx,sbY-3); ctx.lineTo(sbX+scaleBarPx,sbY+3);
    ctx.stroke();
    ctx.fillStyle='rgba(29,43,29,0.65)';
    ctx.font='10px "DM Mono", monospace';
    ctx.textBaseline='alphabetic';
    ctx.fillText(formatMeters(scaleBarMeters), sbX, sbY-6);
  },[zoneA?.id,zoneB?.id]);

  return(
    <div className="cz-shape-mini">
      <div className="cz-table-head">
        <i className="fa-solid fa-shapes"/>Diferencia de polígonos
      </div>
      <div className="cz-shape-mini-canvas"><canvas ref={ref}/></div>
    </div>
  );
}

function MapLegend({mod,data}){

  var indice=(data&&data.indice)||mod.index;

  var grad=pal
    ? 'linear-gradient(90deg,'+pal.colors.map(function(c,i){return c+' '+Math.round(i/(pal.colors.length-1)*100)+'%';}).join(',')+')'
    : (mod.cmap?CZMap.legendGradient(mod.cmap):'transparent');

/* ══ NUEVO: tabla + chart para índices espectrales ══ */
/* Genera el label dinámico según el índice real usado.
   Ej: si m.label='NDVI prom' y indice='SAVI' → 'SAVI prom'.
   Solo aplica para módulos con index (vegetación, agua, etc.). */
function _dynamicMetricLabel(originalLabel, mod, indiceReal){
  if(!indiceReal || !mod || !mod.index) return originalLabel;
  if(indiceReal === mod.index) return originalLabel;
  // Reemplaza el índice default del módulo por el real
  return originalLabel.replace(mod.index, indiceReal);
}

function MetricsCompareTable({mod,dataA,dataB,zoneA,zoneB}){
  const da=dataA&&dataA[mod.id];
  const db=dataB&&dataB[mod.id];
  // Cuando A y B usan el mismo índice, lo aplicamos a todas las labels.
  // Cuando difieren, mantenemos el label original (el warning ya advierte el mismatch).
  const indA = da && da.indice;
  const indB = db && db.indice;
  const sameIdx = indA && indB && indA === indB;
  const dynamicIdx = sameIdx ? indA : (indA || indB || null);

  return(
    <table className="cz-table cz-table--compact">
      <thead>
        <tr>
          <th>Métrica</th>
          <th><span className="cz-zchip cz-zchip--a">A</span></th>
          <th><span className="cz-zchip cz-zchip--b">B</span></th>
          <th className="cz-th-delta">Δ</th>
        </tr>
      </thead>
      <tbody>
        {mod.metrics.map(m=>{
          const a=da&&da[m.key]!=null?da[m.key]:null;
          const b=db&&db[m.key]!=null?db[m.key]:null;
          const{arrow,sentiment,diff}=czDelta(a,b,m.better||'none');
          const sc=sentColor(sentiment);
          // Label dinámico: usa el índice real si A y B coinciden
          const label = sameIdx ? _dynamicMetricLabel(m.label, mod, dynamicIdx) : m.label;
          return(
            <tr key={m.key}>
              <td className="cz-td-label">{label}</td>
              <td className="cz-td-num">{czFmt(a,m.fmt||'dec',m.unit)}</td>
              <td className="cz-td-num">{czFmt(b,m.fmt||'dec',m.unit)}</td>
              <td className="cz-td-delta" style={{color:sc}}>
                {a!=null&&b!=null?arrow+' '+czFmtDelta(diff,m.fmt||'dec',m.unit):'—'}
              </td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

function MetricsBarsChart({mod,dataA,dataB,zoneA,zoneB}){
  const ref=useRef(null);
  const chartRef=useRef(null);
  useEffect(()=>{
    if(!ref.current||typeof Chart==='undefined') return;
    const da=dataA&&dataA[mod.id];
    const db=dataB&&dataB[mod.id];
    const metrics=mod.metrics||[];
    // Labels dinámicos según índice real (NDVI/SAVI/EVI...)
    const indA = da && da.indice;
    const indB = db && db.indice;
    const sameIdx = indA && indB && indA === indB;
    const dynIdx = sameIdx ? indA : (indA || indB || null);
    const labels=metrics.map(m=>sameIdx ? _dynamicMetricLabel(m.label, mod, dynIdx) : m.label);
    const va=metrics.map(m=>da&&da[m.key]!=null?Number(da[m.key]):null);
    const vb=metrics.map(m=>db&&db[m.key]!=null?Number(db[m.key]):null);
    if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}
    chartRef.current=new Chart(ref.current,{
      type:'bar',
      data:{labels,datasets:[
        {label:(zoneA&&zoneA.name)||'Zona A',data:va,backgroundColor:'rgba(200,168,130,0.78)',borderColor:'#C8A882',borderWidth:1,borderRadius:4},
        {label:(zoneB&&zoneB.name)||'Zona B',data:vb,backgroundColor:'rgba(106,170,53,0.78)',borderColor:'#6AAA35',borderWidth:1,borderRadius:4},
      ]},
      options:{
        responsive:true, maintainAspectRatio:false,
        indexAxis:'y',
        scales:{
          x:{ticks:{color:'rgba(29,43,29,0.60)',font:{family:'DM Mono',size:10}},grid:{color:'rgba(31,61,28,0.10)'}},
          y:{ticks:{color:'rgba(29,43,29,0.68)',font:{family:'DM Mono',size:10}},grid:{display:false}}
        },
        plugins:{
          legend:{position:'bottom',labels:{color:'rgba(29,43,29,0.72)',font:{family:'DM Mono',size:10},usePointStyle:true,pointStyle:'rectRounded',boxWidth:8,padding:14}},
          tooltip:{titleFont:{family:'DM Mono'},bodyFont:{family:'DM Mono'}}
        }
      }
    });
    return()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}};
  },[mod,dataA,dataB,zoneA,zoneB]);
  return<div className="cz-metrics-chart-canvas"><canvas ref={ref}/></div>;
}

              <td className="cz-td-num">{czFmt(a,r.fmt||'int',r.unit)}</td>
              <td className="cz-td-num">{czFmt(b,r.fmt||'int',r.unit)}</td>
              <td className="cz-td-delta" style={{color:sc}}>
                {a!=null&&b!=null?arrow+' '+czFmtDelta(diff,r.fmt||'int',r.unit):'—'}
              </td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

function BioThreatDonut({data,side,zoneName}){

  useEffect(()=>{
    if(!ref.current||typeof Chart==='undefined'||!data) return;
    if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}
    const total=data.n_especies||0;
    const cr=data.n_cr||0, en=data.n_en||0, vu=data.n_vu||0;
    const sinThreat=Math.max(0,total-(cr+en+vu));
    chartRef.current=new Chart(ref.current,{
      type:'doughnut',
      data:{
        labels:['Crítico','Peligro','Vulnerable','Otras'],
        datasets:[{
          data:[cr,en,vu,sinThreat],
          backgroundColor:['#e74c3c','#e67e22','#f1c40f','rgba(106,170,53,0.45)'],

          tooltip:{titleFont:{family:'DM Mono'},bodyFont:{family:'DM Mono'},
            callbacks:{label:function(ctx){
